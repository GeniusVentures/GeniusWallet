plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def secureStorageAarName = "securestorage-release.aar"
def secureStorageAarDest = file("$projectDir/libs/${secureStorageAarName}")

def secureStorageAarCandidates = [
    file("$rootProject.projectDir/../../GeniusSDK/build/Android/Release/arm64-v8a/GeniusSDK/lib/${secureStorageAarName}"),
    file("$rootProject.projectDir/../../GeniusSDK/build/Android/Release/armeabi-v7a/GeniusSDK/lib/${secureStorageAarName}"),
]

tasks.register("syncSecureStorageAar") {
    doLast {
        def sourceAar = secureStorageAarCandidates.find { it.exists() }

        if (sourceAar == null) {
            def searched = secureStorageAarCandidates.collect { "  - ${it.absolutePath}" }.join("\n")
            throw new GradleException("Could not locate ${secureStorageAarName}. Searched:\n${searched}")
        }

        secureStorageAarDest.parentFile.mkdirs()
        copy {
            from sourceAar
            into secureStorageAarDest.parentFile
            rename { secureStorageAarName }
        }

        logger.lifecycle("Using ${secureStorageAarName} from: ${sourceAar.absolutePath}")
    }
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Load keystore properties
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    // compileSdkVersion flutter.compileSdkVersion
    compileSdkVersion 35
    ndkVersion "27.1.12297006"

    namespace "ai.gnus.genius_wallet"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }


    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    // x86_64 is for emulator support on windows, however wallet kit does not work on this arch
    defaultConfig {
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
        splits {
            abi {
                enable false
            }
        }
        externalNativeBuild {
            cmake {
                def cmakeArgs = System.getenv("CMAKE_ARGUMENTS")
                def argList = []

                if (cmakeArgs != null) {
                    argList.addAll(cmakeArgs.split(" "))
                }

                // Always enable verbose makefile output
                argList.add("-DCMAKE_VERBOSE_MAKEFILE=ON")

                // Assign final list to 'arguments'
                arguments.addAll(argList)
            }
        }

        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "ai.gnus.genius_wallet"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-build-configuration.
        minSdkVersion 29
        targetSdkVersion 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }
    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }
    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }
}

def syncSecureStorageAarTask = tasks.named("syncSecureStorageAar")

afterEvaluate {
    // CMake configure/build tasks produce downloaded native dependencies.
    tasks.matching { task ->
        def name = task.name.toLowerCase()
        name.contains("cmake") || name.contains("externalnativebuild")
    }.configureEach { task ->
        syncSecureStorageAarTask.configure {
            dependsOn(task)
        }
    }

    // Ensure AAR exists before Java/Kotlin compilation.
    tasks.matching { task ->
        task.name ==~ /compile.*JavaWithJavac/ || task.name ==~ /compile.*Kotlin/
    }.configureEach { task ->
        task.dependsOn(syncSecureStorageAarTask)
    }
}

dependencies {
    implementation files("libs/${secureStorageAarName}")
}

flutter {
    source '../..'
}
