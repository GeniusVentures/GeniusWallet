name: webview_all
version: 1.4.4
description: Vendored app-facing API of abandoft/webview_all (b9eac11). The plugin platform map and every non-Linux implementation are removed, so on Linux it drives webview_all_linux and nothing is added to the other platforms.
publish_to: none

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  webview_platform_interface:
    path: ../webview_platform_interface
