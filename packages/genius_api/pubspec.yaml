name: genius_api
publish_to: none
version: 2.0.0

environment:
  sdk: "^3.10.0"

dev_dependencies:
  # analysis_options.yaml opens with `include: package:lints/recommended.yaml`,
  # so this package needs `lints` declared. It resolved by accident through the
  # root's package config until a re-resolution dropped it and `flutter analyze`
  # started exiting 1 on `include_file_not_found`. Same class of fix as 22-06's
  # depend_on_referenced_packages pass: declare what you reference.
  lints: ^6.1.0
  ffigen: ^20.1.1
  build_runner: ^2.8.0
  freezed: ^3.2.3
  json_serializable: ^6.8.0
  hive_ce_generator: ^1.10.0

dependencies:
  flutter:
    sdk: flutter
  convert: 3.1.2
  ffi: 2.2.0
  freezed_annotation: ^3.1.0
  hive_ce: ^2.19.3
  http: ^1.5.0
  local_secure_storage:
    path: ../local_secure_storage
  path_provider: 2.1.6
  permission_handler: ^12.0.1
  protobuf: ^6.0.0
  reown_walletkit: ^1.3.2
  rxdart: 0.27.7
  wallet: ^0.0.13
  web3dart: ^3.0.2
