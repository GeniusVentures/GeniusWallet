<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Sketch 166 · Screens — board F, every screen, component-tagged</title>
<link rel="stylesheet" href="../themes/default.css">
<style>
/* ───────────────────────────────────────────────────────────────────────────
   Board F applied across the WHOLE compute flow, with every element tagged by
   the component that already renders it.

   Toggle "Components" in the toolbar: each element gets a badge.
     GREEN badge  = component exists AND is already used on this screen today
     BLUE badge   = component exists elsewhere in the app, reused here
     AMBER badge  = genuinely new, must be built
   The count in the header is the honest answer to "how much do we invent?"
   ─────────────────────────────────────────────────────────────────────────── */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--surface-base); color: var(--text-primary);
       font-family: var(--font); padding-top: 108px; -webkit-font-smoothing: antialiased; }

#tabs { position: fixed; top: 0; left: 0; right: 0; z-index: 9998; background: #05070A;
        border-bottom: 1px solid rgba(255,255,255,.14); padding: 8px 12px 0; }
#tabs .row { display: flex; gap: 4px; flex-wrap: wrap; }
.tab { background: transparent; border: 1px solid transparent; color: #8A8F9D;
       font: 600 12px/16px var(--font); letter-spacing: .3px; padding: 7px 11px;
       border-radius: 8px 8px 0 0; cursor: pointer; transition: all .15s ease; white-space: nowrap; }
.tab:hover { background: rgba(20,200,255,.08); color: #fff; }
.tab.active { background: var(--surface-base); color: #fff;
              border-color: rgba(255,255,255,.14); border-bottom-color: var(--surface-base); }
#tabs .meta { font: 400 11px/22px var(--font); color: #5A606E; padding: 2px 4px 8px;
              display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
#tabs .meta b { color: #0AD89C; }
.legend { display: inline-flex; gap: 8px; align-items: center; }
.lg { font: 600 9px/1 var(--font-mono); padding: 3px 5px; border-radius: 3px; }
.lg.have { background: rgba(10,216,156,.18); color: #0AD89C; border: 1px solid rgba(10,216,156,.5); }
.lg.reuse{ background: rgba(20,200,255,.16); color: #14C8FF; border: 1px solid rgba(20,200,255,.5); }
.lg.new  { background: rgba(255,196,46,.16); color: #FFC42E; border: 1px solid rgba(255,196,46,.5); }

#tools { position: fixed; bottom: 12px; right: 12px; z-index: 9999; font: 400 12px/1 var(--font);
  background: rgba(0,0,0,.85); color: #fff; padding: 8px 10px; border-radius: 10px;
  opacity: .38; transition: opacity .2s; display: flex; gap: 8px; align-items: center;
  border: 1px solid rgba(255,255,255,.14); }
#tools:hover { opacity: 1; }
#tools button, #tools select { background: rgba(255,255,255,.09); color: #fff;
  border: 1px solid rgba(255,255,255,.18); border-radius: 6px; padding: 5px 8px;
  font: 500 11px/1 var(--font); cursor: pointer; }
#tools button.on { background: #14C8FF; color: #05070A; border-color: #14C8FF; }

.screen { display: none; max-width: 1180px; margin: 0 auto; padding: 0 16px 70px; }
.screen.active { display: block; }
.head { margin-bottom: 18px; padding: 12px 14px; border-left: 3px solid var(--brand-primary);
        background: rgba(20,200,255,.06); border-radius: 0 8px 8px 0; }
.head h2 { margin: 0 0 4px; font: 600 15px/20px var(--font); }
.head p { margin: 0; font: 400 13px/19px var(--font); color: var(--text-secondary); }
.head .src { margin-top: 6px; font: 400 11px/16px var(--font-mono); color: var(--brand-secondary); }

.rowWrap { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; }
.caseLabel { font: 600 11px/16px var(--font-mono); color: var(--brand-secondary);
             letter-spacing: .3px; margin-bottom: 6px; }
.caseLabel.bad { color: var(--status-error); }
.caseLabel.warn { color: var(--status-warning); }

/* ── Component provenance ────────────────────────────────────────────────
   Badges are HOVER-ONLY and absolutely positioned, so at rest they occupy no
   space and can never sit on top of the design. Inspect mode adds a dashed
   outline; `:has()` suppresses an ancestor's badge while a descendant is
   hovered, so exactly ONE badge is ever visible. */
.cmp { position: relative; }
.cmp > .tag {
  display: none; position: absolute; top: -9px; left: 8px; z-index: 40;
  font: 600 9px/1 var(--font-mono); padding: 3px 5px; border-radius: 3px;
  white-space: nowrap; pointer-events: none; box-shadow: 0 2px 8px rgba(0,0,0,.6);
}
.cmp > .tag.have { background: #0AD89C; color: #04211A; }
.cmp > .tag.reuse{ background: #14C8FF; color: #04212B; }
.cmp > .tag.new  { background: #FFC42E; color: #241A00; }

body.showCmp .cmp { outline: 1px dashed rgba(255,255,255,.14); outline-offset: 2px; }
body.showCmp .cmp.isnew { outline: 1px dashed rgba(255,196,46,.85); }
/* The one genuinely-new element stays marked at rest, because it is the
   answer to "how much must we build" and should not need hunting for. */
body.showCmp .cmp.isnew > .tag { display: block; }
body.showCmp .cmp:hover { outline-color: rgba(20,200,255,.85); }
body.showCmp .cmp:hover > .tag { display: block; }
body.showCmp .cmp:has(.cmp:hover) > .tag { display: none; }
body.showCmp .cmp:has(.cmp:hover) { outline-color: rgba(255,255,255,.14); }

.kicker      { font: 600 13px/18px var(--font); letter-spacing:.5px; text-transform:uppercase; color: var(--text-secondary); }
.kickerDense { font: 600 11px/16px var(--font); letter-spacing:.6px; text-transform:uppercase; color: var(--text-secondary); }

/* 460px, not 340. The dashboard's first card is a full column - at 340 the
   sub-lines wrapped ("No wallet / selected", "Switch / wallet ›"), which is a
   mockup artefact the real panel does not have and must not be judged on. */
.panel { background: var(--surface-elevated); border: 1px solid var(--border-subtle);
         border-radius: var(--radius-md); padding: 16px; width: 460px; }
.tiles2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
.well { background: var(--surface-sunken); border: 1px solid var(--border-subtle);
        border-radius: var(--radius-sm); padding: 12px; }
.statusRow { display: flex; align-items: center; gap: 8px; margin-top: 3px; }
.dot { width: 8px; height: 8px; border-radius: 4px; flex: none; }
.dot.neutral{background:var(--status-neutral)} .dot.warning{background:var(--status-warning)}
.dot.success{background:var(--status-success)} .dot.brand{background:var(--brand-primary)}
.dot.error{background:var(--status-error)}
.dot.pulse { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
.stLabel { font: 500 13px/18px var(--font); color: var(--text-primary); }
.stTrail { font: 500 13px/18px var(--font); font-variant-numeric: tabular-nums;
           color: var(--text-secondary); margin-left: auto; }
.subline { font: 400 12px/17px var(--font); color: var(--text-secondary); margin-top: 4px;
           display: flex; gap: 6px; align-items: baseline; }
.subline .lnk { color: var(--brand-primary); font-weight: 600; cursor: pointer; }
.subline .lnk:hover { text-decoration: underline; }
.bar { height: 4px; margin-top: 6px; border-radius: 2px; background: var(--surface-sunken);
       border: .5px solid var(--border-subtle); overflow: hidden; }
.bar > i { display:block; height:100%; border-radius:2px;
           background: linear-gradient(90deg,var(--brand-cta-a),var(--brand-cta-b)); }
.bar.frozen > i { background: var(--border-strong); }

/* Drawer — ResponsiveDrawer, 420px */
.drawer { width: 420px; background: var(--surface-elevated);
          border: 1px solid var(--border-subtle); border-radius: var(--radius-md); overflow: hidden; }
.drawerHead { display: flex; align-items: center; gap: 10px; padding: 14px 16px;
              border-bottom: 1px solid var(--border-subtle); }
.drawerHead .t { font: 600 16px/22px var(--font); flex: 1; }
.xbtn { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center;
        border: 1px solid var(--border-subtle); background: transparent; color: var(--text-secondary);
        cursor: pointer; transition: all .15s ease; }
.xbtn:hover { color: #fff; border-color: rgba(20,200,255,.45); background: rgba(20,200,255,.10); }
.drawerBody { padding: 16px; }
.drawerFoot { padding: 14px 16px; border-top: 1px solid var(--border-subtle); display: flex; gap: 8px; }

/* Step list — job_step_list.dart */
.step { display: flex; gap: 12px; }
.stepRail { display: flex; flex-direction: column; align-items: center; flex: none; }
.badge { width: 20px; height: 20px; border-radius: 10px; display: grid; place-items: center;
         font: 600 11px/1 var(--font); flex: none;
         border: 1px solid var(--border-subtle); color: var(--text-secondary); }
.badge.cur  { border: 1.5px solid var(--text-primary); color: var(--text-primary); }
.badge.done { background: var(--status-success); border-color: var(--status-success);
              color: var(--text-on-brand); }
.rail { width: 1px; flex: 1; min-height: 14px; background: var(--border-subtle); margin: 4px 0; }
.stepMain { padding-bottom: 14px; flex: 1; min-width: 0; }
.stepT { font: 500 14px/20px var(--font); color: var(--text-secondary); }
.stepT.on { color: var(--text-primary); }
.stepSum { font: 400 12px/17px var(--font); color: var(--text-secondary); margin-top: 2px; }
.stepBody { margin-top: 10px; }

.grid { background: var(--surface-sunken); border: 1px solid var(--border-subtle);
        border-radius: var(--radius-sm); overflow: hidden; }
.grid .r { display: flex; align-items: center; justify-content: space-between; gap: 12px;
           padding: 11px 12px; border-bottom: 1px solid var(--border-subtle); }
.grid .r:last-child { border-bottom: 0; }
.grid .k { font: 400 14px/20px var(--font); color: var(--text-primary-70); }
.grid .v { font: 400 14px/20px var(--font); font-variant-numeric: tabular-nums; color: var(--text-primary); }
.grid .r.tap { cursor: pointer; transition: background .15s ease; }
.grid .r.tap:hover { background: rgba(20,200,255,.07); }

/* GWWarningNote — feedback/gw_warning_note.dart */
.warnNote { display: flex; gap: 10px; padding: 11px 12px; border-radius: var(--radius-sm);
  background: rgba(255,196,46,.13); border: 1px solid var(--status-warning);
  font: 400 13px/19px var(--font); color: var(--text-primary); }
.warnNote .g { color: var(--status-warning); flex: none; }

.spin { width: 16px; height: 16px; border-radius: 8px; flex: none;
        border: 2px solid var(--border-strong); border-top-color: var(--brand-primary);
        animation: sp .8s linear infinite; }
.spin.lg { width: 20px; height: 20px; }
@keyframes sp { to { transform: rotate(360deg); } }
.inlineRow { display: flex; align-items: center; gap: 8px;
             font: 400 14px/20px var(--font); color: var(--text-secondary); }
.inlineRow.pri { color: var(--text-primary); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 40px; padding: 0 16px; border-radius: 999px; cursor: pointer;
  font: 600 14px/20px var(--font); transition: all .15s ease;
  border: 1px solid var(--border-strong); background: transparent; color: var(--text-primary); }
.btn:hover { background: rgba(20,200,255,.10); border-color: rgba(20,200,255,.45); }
.btn.fill { background: linear-gradient(135deg,var(--brand-cta-a),var(--brand-cta-b));
            border-color: transparent; color: var(--text-on-brand); }
.btn.fill:hover { filter: brightness(1.09); }
.btn.fill[disabled] { background: var(--surface-menu); color: var(--text-primary-38);
                      cursor: not-allowed; filter: none; }
.btn.grow { flex: 1; }

.mono { font: 400 12px/1.5 var(--font-mono); color: var(--brand-primary); word-break: break-all; }
.note { margin-top: 16px; padding: 10px 12px; border-radius: 8px; background: rgba(255,255,255,.04);
  border: 1px solid var(--border-subtle); font: 400 12px/18px var(--font); color: var(--text-secondary); }
.note b { color: var(--text-primary); font-weight: 600; }
.note code { font: 400 11px/1.5 var(--font-mono); color: var(--brand-primary); }

table.inv { width: 100%; border-collapse: collapse; margin-top: 10px; }
table.inv th, table.inv td { text-align: left; padding: 7px 10px; font: 400 12px/17px var(--font);
  border-bottom: 1px solid var(--border-subtle); }
table.inv th { font-weight: 600; color: var(--text-secondary); text-transform: uppercase;
  font-size: 10px; letter-spacing: .5px; }
table.inv td code { font: 400 11px/1.5 var(--font-mono); color: var(--brand-primary); }

/* Per-screen "what is new here" banner — answered up front on every screen,
   so it never has to be hunted for with the cursor. */
.newBar { display: flex; gap: 10px; align-items: flex-start; margin: -6px 0 18px;
  padding: 9px 12px; border-radius: 8px; font: 400 12px/18px var(--font); }
.newBar.none { background: rgba(10,216,156,.09); border: 1px solid rgba(10,216,156,.4); }
.newBar.some { background: rgba(255,196,46,.09); border: 1px solid rgba(255,196,46,.5); }
.newBar .h { font: 600 10px/16px var(--font-mono); letter-spacing:.4px; flex: none;
  padding: 1px 6px; border-radius: 3px; }
.newBar.none .h { background: #0AD89C; color: #04211A; }
.newBar.some .h { background: #FFC42E; color: #241A00; }
.newBar b { color: var(--text-primary); font-weight: 600; }

/* Option cards — for the two decisions this sketch puts to Jakub */
.opt { border: 1px solid var(--border-subtle); border-radius: var(--radius-md);
  padding: 14px; background: rgba(255,255,255,.02); width: 420px; }
.opt.pick { border-color: rgba(10,216,156,.6); background: rgba(10,216,156,.05); }
.opt h4 { margin: 0 0 4px; font: 600 13px/18px var(--font); }
.opt .why { font: 400 12px/17px var(--font); color: var(--text-secondary); margin-bottom: 10px; }
.opt .cost { font: 600 10px/15px var(--font-mono); margin-top: 10px; }
.opt .cost.ok  { color: #0AD89C; }
.opt .cost.bad { color: #FFC42E; }
.demoBox { background: var(--surface-elevated); border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm); padding: 14px; }
.tick { width: 16px; height: 16px; border-radius: 8px; flex: none; display: grid;
  place-items: center; font-size: 10px;
  border: 1px solid var(--border-subtle); color: var(--text-secondary); }
.tick.done { background: var(--status-success); border-color: var(--status-success);
  color: var(--text-on-brand); }

.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(80px);
  background: var(--surface-menu); border: 1px solid rgba(20,200,255,.45); color: #fff;
  padding: 10px 18px; border-radius: 999px; font: 600 13px/18px var(--font); z-index: 9999;
  transition: transform .25s ease; pointer-events: none; }
.toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="tabs">
  <div class="row" id="tabRow"></div>
  <div class="meta">
    <span id="tabMeta"></span>
    <span class="legend">
      <span style="color:#5A606E">Components → hover an element to name it:</span>
      <span class="lg have">ALREADY HERE</span>
      <span class="lg reuse">REUSED</span>
      <span class="lg new">MUST BUILD — always shown</span>
    </span>
  </div>
</div>
<div id="stage"></div>
<div class="toast" id="toast"></div>

<div id="tools">
  <select id="themeSel"><option value="dark">Dark</option><option value="light">Light</option></select>
  <button id="cmpBtn" title="Outline every element; hover one to name its component">Components</button>
</div>

<script>
const say = m => { const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show');
  clearTimeout(window._t); window._t=setTimeout(()=>t.classList.remove('show'),1600); };

/* ═══════════════════════════════════════════════════════════════════════════
   Component provenance. `k` is the badge kind:
     have  = this component ALREADY renders this exact element today
     reuse = component exists in lib/components, used elsewhere, applied here
     new   = genuinely must be built
   Every entry names a real file. Nothing is asserted that was not read.
   ═══════════════════════════════════════════════════════════════════════════ */
const C = {
  card:      {k:'have',  n:'GWCard',        f:'cards/gw_card.dart'},
  kicker:    {k:'have',  n:'GWKicker',      f:'cards/gw_kicker.dart'},
  dot:       {k:'have',  n:'GWStatusDot',   f:'data/gw_status_dot.dart'},
  grid:      {k:'have',  n:'GWDetailGrid',  f:'cards/gw_detail_grid.dart'},
  copyRow:   {k:'have',  n:'GWCopyRow',     f:'data/gw_copy_row.dart'},
  warn:      {k:'have',  n:'GWWarningNote', f:'feedback/gw_warning_note.dart'},
  spinner:   {k:'have',  n:'GWSpinner',     f:'loading/gw_spinner.dart'},
  button:    {k:'have',  n:'GWButton',      f:'buttons/gw_button.dart'},
  animNum:   {k:'have',  n:'GWAnimatedNumber', f:'data/gw_animated_number.dart'},
  drawer:    {k:'have',  n:'ResponsiveDrawer', f:'bottom_drawer/responsive_drawer.dart'},
  stepList:  {k:'have',  n:'JobStepList',   f:'submit_job/view/widgets/job_step_list.dart'},
  bar:       {k:'have',  n:'_ComputeProgressBar', f:'dashboard/compute/compute_panel.dart:378'},
  subline:   {k:'have',  n:'_SublineRow',   f:'dashboard/compute/compute_panel.dart:322'},
  tile:      {k:'have',  n:'_ComputeCardTile', f:'dashboard/compute/compute_panel.dart:147'},
  empty:     {k:'reuse', n:'GWEmptyState',  f:'feedback/gw_empty_state.dart'},
  error:     {k:'reuse', n:'GWErrorState',  f:'feedback/gw_error_state.dart'},
  /* The ONLY new things board F needs. Both are copy/state, not new widgets. */
  feedLine:  {k:'new',   n:'feed-health sub-line', f:'copy + 1 bloc flag — reuses _SublineRow'},
  reconnect: {k:'new',   n:'Reconnect link',       f:'copy — reuses _SublineRow\'s existing link slot'}
};
const tag = key => { const c = C[key];
  return `<span class="tag ${c.k}">${c.n}${c.k==='new'?' ⚠':''}</span>`; };
const wrap = (key, html) => `<div class="cmp ${C[key].k==='new'?'isnew':''}">${tag(key)}${html}</div>`;

/* ── Panel pieces ───────────────────────────────────────────────────────── */
function computeTile(o) {
  return wrap('tile', `<div class="well">
    ${wrap('kicker', `<div class="kickerDense">Compute node</div>`)}
    ${wrap('dot', `<div class="statusRow">
      <span class="dot ${o.dot}${o.pulse?' pulse':''}"></span>
      <span class="stLabel">${o.label}</span>
      ${o.trail?`<span class="stTrail">${o.trail}</span>`:''}
    </div>`)}
    ${o.subline ? wrap(o.newLine ? 'feedLine' : 'subline',
      `<div class="subline"><span>${o.subline}</span>${
        o.link ? `<span class="lnk" onclick="say('${o.link}')">${o.link}</span>` : ''}</div>`) : ''}
    ${o.bar ? wrap('bar', `<div class="bar${o.bar==='frozen'?' frozen':''}"><i style="width:${o.pctv}%"></i></div>`) : ''}
  </div>`);
}
const balTile = () => wrap('tile', `<div class="well">
  ${wrap('kicker', `<div class="kickerDense">Balance</div>`)}
  ${wrap('animNum', `<div class="statusRow"><span
    style="font:600 20px/26px var(--font);font-variant-numeric:tabular-nums">1,284.50</span></div>`)}
  <div class="subline"><span>≈ $412.77</span></div></div>`);

const panel = inner => wrap('card', `<div class="panel">
  ${wrap('kicker', `<div class="kicker">Compute</div>`)}
  <div class="tiles2">${balTile()}${inner}</div>
  <div style="margin-top:12px">${wrap('button',
    `<button class="btn fill" style="width:100%" onclick="say('opens JobDrawer')">New processing job</button>`)}</div>
</div>`);

/* ── Drawer + step list ─────────────────────────────────────────────────── */
const STEPS = ['Choose a file','Cost','Confirm','In flight','Result'];
function stepList(cur, bodies, summaries) {
  return wrap('stepList', STEPS.map((t,i) => {
    const done = i < cur, on = i === cur;
    return `<div class="step">
      <div class="stepRail">
        <span class="badge ${done?'done':on?'cur':''}">${done?'✓':(i+1)}</span>
        ${i < STEPS.length-1 ? '<span class="rail"></span>' : ''}
      </div>
      <div class="stepMain">
        <div class="stepT ${on||done?'on':''}">${t}</div>
        ${summaries && summaries[i] ? `<div class="stepSum">${summaries[i]}</div>` : ''}
        ${on && bodies[i] ? `<div class="stepBody">${bodies[i]}</div>` : ''}
      </div></div>`;
  }).join(''));
}
const drawer = (cur, bodies, foot, summaries) => wrap('drawer', `<div class="drawer">
  <div class="drawerHead"><span class="t">New processing job</span>
    <button class="xbtn" onclick="say('drawer dismissed - cubit survives')">✕</button></div>
  <div class="drawerBody">${stepList(cur, bodies, summaries)}</div>
  <div class="drawerFoot">${foot}</div></div>`);

const costGrid = (bal='1,284.50') => wrap('grid', `<div class="grid">
  <div class="r"><span class="k">Job cost</span><span class="v">12.40 GNUS</span></div>
  <div class="r"><span class="k">Bridge gas</span><span class="v">0.0021 ETH</span></div>
  <div class="r"><span class="k">Your balance</span><span class="v">${bal} GNUS</span></div>
</div>`);

/* ═══ SCREENS ══════════════════════════════════════════════════════════════ */
const SCREENS = [
  {
    id:'panel', tab:'1 · Panel states', title:'Dashboard panel — board F applied to all 8 states',
    src:'compute_panel.dart:32-105 · compute_state.dart:29-67',
    lead:'The shipped state ladder, redrawn with board F: no determinate bar during startingUp, and a dead feed says so. Every other state is byte-for-byte what ships today.',
    newItems: [
      {what:'feed-dead flag', kind:'bloc state', where:'app_bloc.dart:192-195'},
      {what:'"Feed live" / "Feed stopped" + Reconnect', kind:'copy + 1 enum member',
       where:'renders through the existing _SublineRow'}],
    body: () => `<div class="rowWrap">
      ${[
        {t:'01 · No wallet',    o:{dot:'neutral',label:'No wallet selected',subline:'Choose a wallet',link:'Switch wallet ›'}},
        {t:'02 · Disconnected', o:{dot:'error',label:'Disconnected',subline:'Node offline',link:'Retry'}},
        {t:'03 · Not linked',   o:{dot:'warning',label:'Not linked',subline:'Node uses another wallet',link:'Switch wallet ›'}},
        {t:'05 · Starting up ★',o:{dot:'brand',pulse:true,label:'Starting up',trail:'52.5%',subline:'Feed live',newLine:true}},
        {t:'04 · Feed stopped ★',o:{dot:'error',label:'Starting up',trail:'52.5%',subline:'Feed stopped',link:'Reconnect',bar:'frozen',pctv:52.5,newLine:true}},

   list of {what, kind, where}; an empty list renders the green "nothing new"
   bar, which is the answer on four of the six screens. */
const newBar = items => !items || !items.length
  ? `<div class="newBar none"><span class="h">NEW HERE: NONE</span>
      <span>Every element on this screen is a component that already ships.</span></div>`
  : `<div class="newBar some"><span class="h">NEW HERE: ${items.length}</span>
      <span>${items.map(i => `<b>${i.what}</b> — ${i.kind}, ${i.where}`).join(' &nbsp;·&nbsp; ')}</span></div>`;

document.getElementById('stage').innerHTML = SCREENS.map(s => `
  <div class="screen" id="sc-${s.id}">
    <div class="head"><h2>${s.title}</h2><p>${s.lead}</p><div class="src">${s.src}</div></div>
    ${newBar(s.newItems)}
    ${s.body()}
  </div>`).join('');
document.getElementById('tabRow').innerHTML = SCREENS.map((s,i) =>
  `<button class="tab ${i===0?'active':''}" onclick="show('${s.id}',this)">${s.tab}</button>`).join('');
document.getElementById('tabMeta').innerHTML =
  'Board F across every compute screen · <b>0 new widgets</b> · 1 bloc flag + 3 strings';
document.getElementById('sc-' + SCREENS[0].id).classList.add('active');

function show(id, el) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('sc-' + id).classList.add('active');
  el.classList.add('active'); window.scrollTo(0,0);
}
document.getElementById('themeSel').addEventListener('change', function(){
  document.documentElement.setAttribute('data-theme', this.value);
});
document.getElementById('cmpBtn').addEventListener('click', function(){
