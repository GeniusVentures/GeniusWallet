<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>080 · Buy GNUS page</title>
<link rel="stylesheet" href="../themes/default.css">
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  /* Sketch-local tokens that mirror real GWColors getters the shared theme does not carry. */
  :root, [data-theme="light"] {
    --link: #0A6885;              /* brandPrimaryOnSurface, light: 6.30:1 on white */
    --err-text: #991B1B;          /* statusErrorText, light */
    --warn-text: #8A6200;
    --well: #EFF2F6;              /* surfaceWell, light = surfaceMenu */
    --scrim: rgba(16,19,26,.45);
  }
  [data-theme="dark"] {
    --link: #0AAEE6;              /* brandPrimaryOnSurface, dark: 7.54:1 on #0C0E14 */
    --err-text: #FF4D4D;
    --warn-text: #FFC42E;
    --well: #06080C;              /* surfaceWell, dark = surfaceSunken */
    --scrim: rgba(0,0,0,.6);
  }
  body { font-family:var(--font); background:var(--surface-base); color:var(--text-primary); padding:60px 16px 80px; }
  button { font-family:inherit; }
  svg.i { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; }

  /* ---------- sketch chrome ---------- */
  #variant-nav { position:fixed; top:0; left:0; right:0; z-index:9998; display:flex; gap:6px; align-items:center; flex-wrap:wrap;
    background:var(--surface-sunken); border-bottom:1px solid var(--border-subtle); padding:8px 14px; }
  #variant-nav .name { font:600 12px/16px var(--font); color:var(--text-primary); opacity:.75; margin-right:8px; }
  #variant-nav .sep { width:1px; height:20px; background:var(--border-subtle); margin:0 6px; }
  #variant-nav .lbl { font:500 11px/16px var(--font); color:var(--text-secondary); text-transform:uppercase; letter-spacing:.5px; margin-right:2px; }
  .vt { font:600 12px/16px var(--font); padding:6px 12px; border:1px solid var(--border-subtle); border-radius:var(--radius-pill);
    background:transparent; color:var(--text-secondary); cursor:pointer; transition:all .15s ease; }
  .vt:hover { color:var(--text-primary); transform:translateY(-1px); }
  .vt.active { background:var(--surface-elevated); color:var(--text-primary); border-color:transparent; box-shadow:var(--shadow-card); }
  .st { font:500 12px/16px var(--font); padding:5px 10px; border:1px solid var(--border-subtle); border-radius:var(--radius-pill);
    background:transparent; color:var(--text-secondary); cursor:pointer; transition:all .15s ease; }
  .st:hover { color:var(--text-primary); border-color:var(--border-strong); }
  .st.on { background:var(--surface-elevated); color:var(--text-primary); border-color:var(--link); font-weight:600; }
  .lede { color:var(--text-secondary); font:400 13px/20px var(--font); margin:0 auto 18px; max-width:880px; text-align:center; }
  .lede b { color:var(--text-primary); }
  #sketch-tools { position:fixed; bottom:12px; right:12px; z-index:9999; font:12px system-ui; background:rgba(0,0,0,.78); color:#fff;
    padding:8px 12px; border-radius:8px; opacity:.8; transition:opacity .2s; display:flex; gap:12px; align-items:center; }
  #sketch-tools:hover { opacity:1; }
  #sketch-tools button { background:none; border:1px solid #555; color:#fff; border-radius:5px; padding:3px 8px; cursor:pointer; font:12px system-ui; }
  #sketch-tools button.on { background:#fff; color:#000; border-color:#fff; }

  #stage { display:flex; justify-content:center; overflow-x:auto; padding-bottom:8px; }

  /* ---------- desktop app window ---------- */
  .win { position:relative; width:1280px; flex:none; min-height:780px; border:1px solid var(--border-strong); border-radius:var(--radius-lg);
    overflow:hidden; background:var(--surface-base); box-shadow:var(--shadow-card); }
  .navbar { display:flex; align-items:center; gap:28px; height:56px; padding:0 20px; background:var(--surface-sunken);
    border-bottom:1px solid var(--border-subtle); font:500 14px/16px var(--font); color:var(--text-secondary); }
  .navbar .logo { width:24px; height:24px; border-radius:7px; background:linear-gradient(135deg,var(--brand-cta-a),var(--brand-cta-b)); flex:none; }
  .navbar .right { margin-left:auto; display:flex; align-items:center; gap:12px; }
  .acct { display:flex; align-items:center; gap:8px; height:40px; padding:0 10px 0 8px; border-radius:var(--radius-md); border:1px solid var(--border-subtle);
    background:var(--surface-menu); color:var(--text-primary); font:500 14px/1 var(--font); cursor:pointer; transition:all .15s ease; }
  .acct:hover { border-color:var(--border-strong); transform:translateY(-1px); }
  .page { padding:32px 24px 48px; }
  .back { display:inline-flex; align-items:center; gap:4px; background:none; border:none; cursor:pointer; color:var(--text-secondary);
    font:600 12px/16px var(--font); letter-spacing:.6px; padding:4px 6px 4px 0; transition:color .15s; }
  .back:hover { color:var(--text-primary); }
  .back svg { width:14px; height:14px; }
  .ptitle { font:600 24px/32px var(--font); letter-spacing:-.4px; margin:6px 0 24px; }

  /* ---------- mobile frame ---------- */
  .phone { position:relative; width:390px; height:844px; flex:none; border:1px solid var(--border-strong); border-radius:36px; overflow:hidden;
    background:var(--surface-base); box-shadow:var(--shadow-card); display:flex; flex-direction:column; }
  .sbar { height:44px; flex:none; display:flex; align-items:center; padding:0 28px; font:600 15px/1 var(--font); color:var(--text-primary); }
  .abar { height:52px; flex:none; display:flex; align-items:center; gap:4px; padding:0 8px; border-bottom:1px solid var(--border-subtle); }
  .abar .t { font:600 18px/24px var(--font); }
  .iconbtn { width:44px; height:44px; display:grid; place-items:center; border:none; background:none; color:var(--text-primary); border-radius:var(--radius-md); cursor:pointer; transition:background .15s; }
  .iconbtn:hover { background:var(--border-subtle); }
  .scroll { flex:1; overflow-y:auto; padding:16px; }
  .mfoot { flex:none; padding:12px 16px 24px; border-top:1px solid var(--border-subtle); background:var(--surface-base); }

  /* ---------- shared atoms ---------- */
  .card { background:var(--surface-elevated); border:1px solid var(--border-subtle); border-radius:var(--radius-lg); box-shadow:var(--shadow-card); }
  .flabel { font:500 13px/18px var(--font); color:var(--text-secondary); }
  .mono { font-family:var(--font-mono); font-size:13px; }
  .num { font-variant-numeric:tabular-nums; }
  .link { background:none; border:none; cursor:pointer; color:var(--link); font:600 13px/18px var(--font); padding:2px 0; border-radius:4px; transition:all .15s; }
  .link:hover { text-decoration:underline; text-underline-offset:3px; }
  .link:focus-visible, .chip:focus-visible, .seg:focus-visible, .cta:focus-visible, .pill-btn:focus-visible { outline:2px solid var(--link); outline-offset:2px; }
  .gnus { width:28px; height:28px; border-radius:50%; flex:none; object-fit:contain; }
  .gnus-fb { display:grid; place-items:center; background:linear-gradient(135deg,var(--brand-cta-a),var(--brand-cta-b)); color:var(--text-on-brand); font:800 11px/1 var(--font); }
  .avatar { border-radius:50%; flex:none; display:grid; place-items:center; color:#fff; font:700 10px/1 var(--font); }

  .amt-in { background:transparent; border:none; outline:none; color:var(--text-primary); font:600 36px/1.1 var(--font); width:100%;
    font-variant-numeric:tabular-nums; letter-spacing:-.5px; min-width:0; }
  .amt-in::placeholder { color:var(--text-primary-38); }
  .limits { font:400 12px/16px var(--font); color:var(--text-secondary); min-height:16px; }
  .limits.err { color:var(--err-text); font-weight:500; }

  .track { display:flex; gap:3px; padding:3px; background:var(--well); border:1px solid var(--border-subtle); border-radius:var(--radius-md); }
  .chip, .seg { flex:1; height:32px; border:none; border-radius:9px; background:transparent; color:var(--text-primary-70);
    font:600 13px/1 var(--font); font-variant-numeric:tabular-nums; cursor:pointer; transition:all .15s ease; white-space:nowrap; padding:0 8px; }
  .chip:hover, .seg:hover { color:var(--text-primary); background:var(--border-subtle); }
  .chip.on, .seg.on { background:var(--surface-elevated); color:var(--text-primary); box-shadow:0 1px 3px rgba(0,0,0,.18); }
  [data-theme="dark"] .chip.on, [data-theme="dark"] .seg.on { background:var(--surface-menu); }

  .rows .r { display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:9px 0; font:400 14px/20px var(--font); }
  .rows .r .k { color:var(--text-secondary); white-space:nowrap; }
  .rows .r .v { color:var(--text-primary); font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap; }
  .rows.lined .r + .r { border-top:1px solid var(--border-subtle); }

  .wrow { display:flex; align-items:center; gap:10px; min-width:0; }
  .wrow .wname { font:500 14px/20px var(--font); color:var(--text-primary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .wrow .waddr { color:var(--text-secondary); white-space:nowrap; flex:none; }
  .wrow .link { margin-left:auto; flex:none; }
  .paid { display:flex; align-items:center; gap:8px; font:400 14px/20px var(--font); color:var(--text-secondary); }
  .paid svg { width:16px; height:16px; }

  .nowallet { border:1px solid var(--border-strong); border-left:3px solid var(--status-warning); border-radius:var(--radius-md);
    padding:12px 14px; background:var(--surface-menu); font:400 13px/19px var(--font); color:var(--text-primary-70); }
  .nowallet b { color:var(--text-primary); display:block; font-weight:600; font-size:14px; margin-bottom:2px; }
  .btn2 { margin-top:10px; height:36px; padding:0 14px; border-radius:var(--radius-pill); border:1px solid var(--border-strong); background:transparent;
    color:var(--text-primary); font:600 13px/1 var(--font); cursor:pointer; transition:all .15s; }
  .btn2:hover { border-color:var(--text-primary-54); transform:translateY(-1px); }

  .cta { width:100%; height:52px; border:none; border-radius:var(--radius-pill); font:600 16px/1 var(--font); cursor:pointer;
    color:var(--text-on-brand); background:linear-gradient(90deg,var(--brand-cta-b),var(--brand-cta-a)); transition:all .15s ease;
    display:flex; align-items:center; justify-content:center; gap:8px; }
  .cta:hover:not(:disabled) { filter:brightness(1.06); transform:translateY(-1px); }
  .cta:disabled { cursor:not-allowed; background:var(--surface-menu); color:var(--text-secondary); border:1px solid var(--border-subtle); }
  .cta.busy { cursor:progress; }
  .fine { text-align:center; font:400 12px/18px var(--font); color:var(--text-secondary); margin-top:10px; }
  .fine .by { display:block; font:500 11px/16px var(--font); letter-spacing:.3px; margin-top:2px; }

  /* quote liveness */
  .qmeta { display:inline-flex; align-items:center; gap:6px; font:500 12px/16px var(--font); color:var(--text-secondary); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .qmeta.stale { color:var(--warn-text); }
  .ring { width:16px; height:16px; flex:none; transform:rotate(-90deg); }
  .ring .bg { stroke:var(--border-strong); }
  .ring .fg { stroke:var(--link); transition:stroke-dashoffset .2s linear; }
  .ring.spin { animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(270deg); } }
  [data-k].dim { opacity:.45; transition:opacity .15s; }
  [data-k].skel { color:transparent !important; background:var(--skeleton); border-radius:6px; animation:pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.5; } }
  [data-k].flash { animation:flash .7s ease; }
  @keyframes flash { 0% { background:var(--brand-primary-muted); } 100% { background:transparent; } }
  .spinner { width:16px; height:16px; border-radius:50%; border:2px solid currentColor; border-right-color:transparent; animation:spin2 .7s linear infinite; }
  @keyframes spin2 { to { transform:rotate(360deg); } }

  /* ===== A · Compact card ===== */
  .a-card { width:440px; margin:0 auto; padding:20px; }
  .a-mob .a-card { width:auto; padding:18px 16px; }
  .a-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .a-line { display:flex; align-items:center; gap:10px; }
  .pill-btn { display:inline-flex; align-items:center; gap:6px; height:36px; padding:0 10px 0 12px; border-radius:var(--radius-pill);
    background:var(--surface-menu); border:1px solid var(--border-subtle); color:var(--text-primary); font:700 14px/1 var(--font); cursor:pointer; transition:all .15s; flex:none; }
  .pill-btn:hover { border-color:var(--link); transform:translateY(-1px); }
  .pill-btn svg { width:14px; height:14px; color:var(--text-secondary); }
  .a-seam { position:relative; height:1px; background:var(--border-subtle); margin:16px -20px; }
  .a-mob .a-seam { margin:16px -16px; }
  .a-seam span { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:32px; height:32px; border-radius:10px;
    background:var(--surface-menu); border:1px solid var(--border-subtle); display:grid; place-items:center; color:var(--text-secondary); }
  .a-seam svg { width:16px; height:16px; }
  .a-get { display:flex; align-items:center; gap:10px; margin:4px 0 6px; }
  .a-get .n { font:600 32px/1.1 var(--font); letter-spacing:-.4px; font-variant-numeric:tabular-nums; padding:0 2px; }
  .a-get .u { font:600 16px/1 var(--font); color:var(--text-secondary); }
  .a-sub { padding:12px 0 0; margin-top:12px; border-top:1px solid var(--border-subtle); display:grid; gap:12px; }

  /* ===== B · Form + live receipt ===== */
  .b-grid { display:grid; grid-template-columns:560px 380px; gap:24px; justify-content:center; align-items:start; }
  .b-form { padding:22px; display:grid; gap:18px; }
  .b-amt { display:flex; align-items:center; gap:10px; height:64px; padding:0 14px; border-radius:var(--radius-md); background:var(--well);
    border:1px solid var(--border-control, var(--border-strong)); transition:border-color .15s; }
  .b-amt:focus-within { border-color:var(--link); }
  .b-amt .code { font:600 16px/1 var(--font); color:var(--text-secondary); flex:none; }
  .b-amt .amt-in { font-size:28px; }
  .b-lab { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .b-rcpt { padding:22px; position:sticky; top:16px; }
  .b-hero { text-align:center; }
  .b-ico { width:56px; height:56px; border-radius:50%; margin:0 auto 10px; display:grid; place-items:center;
    background:var(--brand-fill); border:1px solid var(--brand-primary-muted); }
  .b-ico .gnus { width:34px; height:34px; }
  .b-hero .n { font:600 30px/1.15 var(--font); letter-spacing:-.4px; font-variant-numeric:tabular-nums; display:inline-block; padding:0 4px; }
  .b-live:has(.qmeta:empty) { display:none; }
  .b-live { display:inline-flex; align-items:center; gap:7px; margin-top:10px; padding:6px 12px; border-radius:var(--radius-pill);
    background:var(--surface-menu); border:1px solid var(--border-subtle); }
  .sec { font:500 11px/16px var(--font); letter-spacing:.06em; text-transform:uppercase; color:var(--text-secondary); margin:18px 0 6px; }
  .b-rows { background:var(--surface-menu); border:1px solid var(--border-subtle); border-radius:var(--radius-md); padding:2px 14px; }
  [data-theme="light"] .b-rows { background:#F7F9FB; }
  .b-mob .b-grid { grid-template-columns:1fr; gap:14px; }
  .b-mob .b-form { padding:16px; gap:16px; }
  .b-mob .b-rcpt { padding:16px; position:static; }
  .b-sum { display:flex; align-items:center; gap:10px; }
  .b-sum .n { font:600 22px/1.2 var(--font); font-variant-numeric:tabular-nums; padding:0 2px; }
  .b-sum .grow { flex:1; min-width:0; }
  .b-toggle { display:flex; align-items:center; gap:4px; }
  .b-toggle svg { width:14px; height:14px; transition:transform .2s; }
  .b-toggle.open svg { transform:rotate(180deg); }

  /* ===== C · Big number ===== */
  .c-col { width:480px; margin:0 auto; text-align:center; }
  .c-mob .c-col { width:auto; }
  .c-pay { display:flex; justify-content:center; align-items:center; gap:8px; }
  .c-hero { display:flex; justify-content:center; align-items:baseline; gap:4px; margin:10px 0 4px; min-height:84px; }
  .c-hero .sym { font:600 34px/1 var(--font); color:var(--text-secondary); }
  .c-hero .amt-in { font-size:72px; font-weight:600; text-align:center; width:auto; letter-spacing:-1.5px; }
  .c-hero .amt-txt { font:600 72px/1.1 var(--font); letter-spacing:-1.5px; font-variant-numeric:tabular-nums; }
  .c-hero .caret { width:2px; height:56px; background:var(--link); align-self:center; animation:blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  .c-get { display:inline-flex; align-items:center; gap:8px; margin-top:8px; padding:8px 16px; border-radius:var(--radius-pill);
    background:var(--surface-elevated); border:1px solid var(--border-subtle); }
  .c-get .n { font:600 20px/1.2 var(--font); font-variant-numeric:tabular-nums; padding:0 2px; }
  .c-get .gnus { width:24px; height:24px; }
  .c-chips { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:18px 0 20px; }
  .c-chips .chip { flex:none; height:34px; padding:0 14px; border:1px solid var(--border-subtle); border-radius:var(--radius-pill); }
  .c-chips .chip.on { border-color:var(--link); box-shadow:none; background:var(--brand-fill); }
  .c-meta { text-align:left; border-top:1px solid var(--border-subtle); }
  .c-meta > .mr { display:flex; align-items:center; gap:10px; padding:12px 2px; border-bottom:1px solid var(--border-subtle); min-height:48px; }
  .c-meta .k { font:400 14px/20px var(--font); color:var(--text-secondary); width:64px; flex:none; }
  .c-fees { padding:0 2px 6px 76px; }
  .c-keys { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin:14px 0 12px; }
  .c-keys button { height:50px; border:none; border-radius:var(--radius-md); background:transparent; color:var(--text-primary);
    font:500 24px/1 var(--font); cursor:pointer; transition:background .1s; display:grid; place-items:center; }
  .c-keys button:hover { background:var(--surface-menu); }
  .c-keys button:active { background:var(--border-strong); }
  .c-mob .c-hero { min-height:72px; margin:4px 0; }
  .c-mob .c-meta > .mr { padding:8px 2px; min-height:40px; }
  .c-mob .c-chips { margin:12px 0 10px; }
  .c-mob .c-meta .k, .c-mob .c-meta .flabel[style*="width:64px"] { width:52px !important; }
  .c-mob .c-fees { padding-left:0; }

  /* ---------- drawer (ResponsiveDrawer: right panel on desktop, bottom sheet on mobile) ---------- */
  .dlayer { position:absolute; inset:0; z-index:50; pointer-events:none; }
  .dlayer .scrim { position:absolute; inset:0; background:var(--scrim); opacity:0; transition:opacity .2s; }
  .dpanel { position:absolute; background:var(--surface-menu); display:flex; flex-direction:column; transition:transform .25s ease; }
  .win .dpanel { top:0; bottom:0; right:0; width:var(--drawer-width); transform:translateX(105%); box-shadow:-24px 0 60px rgba(0,0,0,.35); }
  .phone .dpanel { left:0; right:0; bottom:0; max-height:78%; border-radius:24px 24px 0 0; transform:translateY(105%); box-shadow:0 -12px 40px rgba(0,0,0,.35); }
  .dlayer.open { pointer-events:auto; }
  .dlayer.open .scrim { opacity:1; }
  .dlayer.open .dpanel { transform:none; }
  .dlayer:not(.open) .dpanel { box-shadow:none; }
  .dhead { display:flex; align-items:center; justify-content:space-between; height:60px; padding:0 12px 0 20px; border-bottom:1px solid var(--border-subtle); flex:none; }
  .dtitle { font:600 18px/24px var(--font); }
  .dbody { flex:1; overflow-y:auto; padding:16px 20px 20px; }
  .dfoot { flex:none; padding:14px 20px 20px; border-top:1px solid var(--border-subtle); }
  .dfoot:empty { display:none; }
  .search { display:flex; align-items:center; gap:8px; height:44px; padding:0 12px; border-radius:var(--radius-md); background:var(--well);
    border:1px solid var(--border-strong); margin-bottom:10px; color:var(--text-secondary); }
  .search:focus-within { border-color:var(--link); }
  .search input { flex:1; background:none; border:none; outline:none; color:var(--text-primary); font:400 15px/1 var(--font); }
  .srow { display:flex; align-items:center; gap:12px; width:100%; padding:10px 10px; border:none; border-radius:var(--radius-md); background:transparent;
    color:var(--text-primary); cursor:pointer; text-align:left; transition:background .15s; }
  .srow:hover { background:var(--border-subtle); }
  .srow.sel { background:var(--brand-primary-subtle); box-shadow:inset 3px 0 0 var(--link); }
  .srow .badge { width:40px; height:28px; border-radius:7px; background:var(--surface-elevated); border:1px solid var(--border-subtle);
    display:grid; place-items:center; font:700 11px/1 var(--font); letter-spacing:.3px; flex:none; }
  .srow .tx { flex:1; min-width:0; }
  .srow .tx b { display:block; font:500 15px/20px var(--font); }
  .srow .tx span { font:400 12px/16px var(--font); color:var(--text-secondary); }
  .srow .chk { color:var(--link); width:18px; height:18px; flex:none; }
  .empty { text-align:center; padding:28px 0; color:var(--text-secondary); font:400 14px/20px var(--font); }

  #toast { position:fixed; bottom:64px; left:50%; transform:translate(-50%,160%); z-index:10000; background:var(--surface-elevated);
    border:1px solid var(--border-subtle); border-left:3px solid var(--link); border-radius:10px; padding:12px 16px; color:var(--text-primary);
    font:500 13px var(--font); box-shadow:var(--shadow-card); transition:transform .25s ease, opacity .25s; max-width:420px; opacity:0; pointer-events:none; }
  #toast.show { transform:translate(-50%,0); opacity:1; }
</style>
</head>
<body>

<div id="variant-nav">
  <span class="name">080 · BUY GNUS</span>
  <button class="vt active" data-v="a" onclick="setVariant('a')">A · Compact card ★</button>
  <button class="vt" data-v="b" onclick="setVariant('b')">B · Form + live receipt</button>
  <button class="vt" data-v="c" onclick="setVariant('c')">C · Big number</button>
  <span class="sep"></span>
  <span class="lbl">State</span>
  <button class="st" data-m="normal" onclick="setMode('normal')">Normal</button>
  <button class="st" data-m="quoting" onclick="setMode('quoting')">Quoting</button>
  <button class="st" data-m="belowmin" onclick="setMode('belowmin')">Below minimum</button>
  <button class="st" data-m="stale" onclick="setMode('stale')">Stale quote</button>
  <button class="st" data-m="nowallet" onclick="setMode('nowallet')">No wallet</button>
</div>

<p class="lede" id="lede"></p>
<div id="stage"></div>

<div id="sketch-tools">
  <span>View
    <button data-vp="desktop" onclick="setVp('desktop')">Desktop 1280</button>
    <button data-vp="mobile" onclick="setVp('mobile')">Mobile 390</button>
  </span>
  <span>Theme
    <button data-th="dark" onclick="setTheme('dark')">Dark</button>
    <button data-th="light" onclick="setTheme('light')">Light</button>
  </span>
</div>
<div id="toast"></div>

<script>
// ---------------- data ----------------
// [code, name, units per USD]. Made-up FX, internally consistent.
const CUR = [
  ['AED','UAE Dirham',3.67], ['AUD','Australian Dollar',1.52], ['CAD','Canadian Dollar',1.37], ['CHF','Swiss Franc',0.88],
  ['CLP','Chilean Peso',940], ['COP','Colombian Peso',4100], ['CZK','Czech Koruna',23.1], ['DKK','Danish Krone',6.87],
  ['EUR','Euro',0.92], ['GBP','British Pound',0.78], ['HKD','Hong Kong Dollar',7.8], ['IDR','Indonesian Rupiah',16200],
  ['JPY','Japanese Yen',148], ['MXN','Mexican Peso',17.9], ['NOK','Norwegian Krone',10.6], ['NZD','New Zealand Dollar',1.66],
  ['PHP','Philippine Peso',57.5], ['PLN','Polish Zloty',3.95], ['QAR','Qatari Riyal',3.64], ['RON','Romanian Leu',4.58],
  ['SAR','Saudi Riyal',3.75], ['SEK','Swedish Krona',10.4], ['SGD','Singapore Dollar',1.34], ['THB','Thai Baht',35.6],
  ['TRY','Turkish Lira',34.2], ['TWD','New Taiwan Dollar',32.1], ['USD','US Dollar',1], ['VND','Vietnamese Dong',25400],
  ['ZAR','South African Rand',18.2],
];
const M = {
  card:{ name:'Card', fee:.0249 }, sepa:{ name:'SEPA', fee:.0099 }, paypal:{ name:'PayPal', fee:.0349 },
  payid:{ name:'PayID', fee:.0100 }, interac:{ name:'Interac', fee:.0150 }, khipu:{ name:'Khipu', fee:.0150 },
  bank:{ name:'Bank transfer', fee:.0100 }, spei:{ name:'SPEI', fee:.0100 },
};
const EXTRA = { EUR:['sepa','paypal'], AUD:['payid'], CAD:['interac'], CLP:['khipu'], ZAR:['bank'], MXN:['spei'] };
const WALLETS = [
  { name:'Main wallet', addr:'0x7a3F2c9E5b18D40a6F3e21B9c07d4E58a1F291c2', g:['#14C8FF','#0AD89C'] },
  { name:'Savings',     addr:'0x51bD08A3e7C94f12b6D2aE0F37c5B81d4A9c0e7A', g:['#C28FFF','#14C8FF'] },
  { name:'Trading',     addr:'0xC04e9B21aF6d73E08c5A12fD94b7e3C06D8e3B9d', g:['#FFC42E','#FF7A45'] },
];
const USD_PRICE = 0.4125;      // made-up GNUS price
const NET_FEE_USD = 0.60;      // made-up flat network fee
const MIN_USD = 20, MAX_USD = 15000;

const S = { v:'a', mode:'normal', vp:'desktop', theme:'dark', fiat:'USD', method:'card', amount:'100', wallet:0,
  price:USD_PRICE, updated:Date.now(), refreshing:false, feesOpen:false, busy:false, drawer:null, q:'' };

// ---------------- helpers ----------------
const C = code => { const c = CUR.find(x => x[0] === code); return { code:c[0], name:c[1], fx:c[2] }; };
const methods = () => ['card', ...(EXTRA[S.fiat] || [])];
const short = a => a.substring(0,6) + '...' + a.substring(a.length - 4);   // WalletUtils.getAddressForDisplay
const sig2 = (x, fn) => { const e = 10 ** (Math.floor(Math.log10(x)) - 1); return Math[fn](x / e) * e; };
function nice(x) {
  const e = 10 ** Math.floor(Math.log10(x)), f = x / e;
  const steps = [1,1.5,2,2.5,3,4,5,7.5,10];
  return steps.reduce((b, s) => Math.abs(s - f) < Math.abs(b - f) ? s : b) * e;
}
function money(v, code, o = {}) {
  const dec = C(code).fx >= 100 ? 0 : 2;
  return new Intl.NumberFormat('en-US', { style:'currency', currency:code,
    minimumFractionDigits:o.min ?? dec, maximumFractionDigits:o.max ?? dec }).format(v);
}
const gn = v => v.toLocaleString('en-US', { minimumFractionDigits:2, maximumFractionDigits:2 });
const presets = () => [...new Set([50,100,250,500].map(v => nice(v * C(S.fiat).fx)))];
const wallet = () => S.mode === 'nowallet' ? null : WALLETS[S.wallet];

function quote() {
  const fx = C(S.fiat).fx, amt = parseFloat(S.amount) || 0;
  const proc = amt * M[S.method].fee, net = NET_FEE_USD * fx, priceF = S.price * fx;
  return { amt, proc, net, priceF, got:Math.max(0, (amt - proc - net) / priceF),
    min:sig2(MIN_USD * fx, 'ceil'), max:sig2(MAX_USD * fx, 'floor') };
}
// One derived status, read by every variant, so the CTA and the numbers cannot disagree.
function status() {
  const q = quote();
  const amountErr = !q.amt ? 'empty' : q.amt < q.min ? 'min' : q.amt > q.max ? 'max' : null;
  return { q, amountErr, noWallet:S.mode === 'nowallet', quoting:S.mode === 'quoting', stale:S.mode === 'stale' };
}

// ---------------- icons ----------------
const I = {
  back:'<svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>',
  caret:'<svg class="i" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>',
  down:'<svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"/></svg>',
  card:'<svg class="i" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>',
  x:'<svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  search:'<svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>',
  check:'<svg class="i chk" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>',
  del:'<svg class="i" viewBox="0 0 24 24" style="width:24px;height:24px"><path d="M21 5H9l-7 7 7 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1Z"/><path d="m17 9-6 6M11 9l6 6"/></svg>',
};
const gnusIcon = cls => `<img class="gnus ${cls||''}" src="../../../assets/images/crypto/gnus.png" alt="" onerror="this.outerHTML='<span class=&quot;gnus gnus-fb ${cls||''}&quot;>G</span>'">`;
const avatar = (w, s = 28) => `<span class="avatar" style="width:${s}px;height:${s}px;background:linear-gradient(135deg,${w.g[0]},${w.g[1]})"></span>`;
const ring = () => `<svg class="ring" viewBox="0 0 16 16"><circle class="bg" cx="8" cy="8" r="6.5" fill="none" stroke-width="2"/><circle class="fg" cx="8" cy="8" r="6.5" fill="none" stroke-width="2" stroke-linecap="round" stroke-dasharray="40.84" stroke-dashoffset="0"/></svg>`;

// ---------------- shared pieces ----------------
const chipLabel = v => v >= 100000
  ? new Intl.NumberFormat('en-US', { style:'currency', currency:S.fiat, notation:'compact', maximumFractionDigits:1 }).format(v)
  : money(v, S.fiat, { min:0, max:0 });
const chips = () => presets().map(v => `<button class="chip" data-k="chip" data-v="${v}" onclick="setAmt('${v}')">${chipLabel(v)}</button>`).join('');
const fiatLink = () => `<span class="flabel" style="display:inline-flex;gap:6px;align-items:center"><b style="color:var(--text-primary);font-weight:600">${S.fiat}</b><button class="link" onclick="openCurrency()">Change</button></span>`;

function payRow(label) {
  const ms = methods();
  if (ms.length === 1) {
    return `<div class="paid">${I.card}Paid by card</div>`;
  }
  return `${label ? `<div class="flabel" style="margin-bottom:8px">${label}</div>` : ''}<div class="track">${ms.map(m =>
    `<button class="seg ${m === S.method ? 'on' : ''}" onclick="setMethod('${m}')">${M[m].name}</button>`).join('')}</div>`;
}
function walletRow(label) {
  const w = wallet();
  const lab = label ? `<span class="flabel" style="width:${label.w}px;flex:none">${label.t}</span>` : '';
  if (!w) {
    return `<div class="nowallet"><b>No wallet to receive GNUS</b>Add or import a wallet first. GNUS is delivered straight to it.
      <div><button class="btn2" onclick="addWallet()">Add wallet</button></div></div>`;
  }
  return `<div class="wrow">${lab}${avatar(w, 24)}<span class="wname">${w.name}</span><span class="waddr mono">${short(w.addr)}</span>
    <button class="link" onclick="openAccounts()">Change</button></div>`;
}
const feeRows = cls => `<div class="rows ${cls||''}">
    <div class="r"><span class="k">Rate</span><span class="v" data-k="rate"></span></div>
    <div class="r"><span class="k">Banxa processing fee</span><span class="v" data-k="proc"></span></div>
    <div class="r"><span class="k">Network fee</span><span class="v" data-k="net"></span></div></div>`;
const cta = () => `<button class="cta" data-k="cta" onclick="buy()"></button>`;
const fine = () => `<div class="fine">Banxa may ask for ID at checkout.<span class="by">Powered by Banxa</span></div>`;
const amountInput = cls => `<input class="amt-in ${cls||''}" data-k="amtInput" inputmode="decimal" placeholder="0" oninput="typeAmt(this)" aria-label="Amount in ${S.fiat}">`;

// ---------------- A · Compact card ----------------
function vA(mob) {
  const inner = `<div class="${mob ? 'a-mob' : ''}"><div class="card a-card">
    <div class="a-top"><span class="flabel">You pay</span><span class="qmeta" data-k="age"></span></div>
    <div class="a-line">${amountInput()}
      <button class="pill-btn" onclick="openCurrency()" aria-label="Change currency">${S.fiat}${I.caret}</button></div>
    <div class="limits" data-k="limits" style="margin:4px 0 12px"></div>
    <div class="track">${chips()}</div>
    <div class="a-seam"><span>${I.down}</span></div>
    <div class="flabel">You get</div>
    <div class="a-get">${gnusIcon()}<span class="n" data-k="got"></span><span class="u">GNUS</span></div>
    ${feeRows()}
    <div class="a-sub">${walletRow({ t:'To', w:28 })}${payRow()}</div>
    ${mob ? '' : `<div style="margin-top:18px">${cta()}</div>${fine()}`}
  </div></div>`;
  return { inner, foot:mob ? cta() + fine() : '' };
}

// ---------------- B · Form + live receipt ----------------
function vB(mob) {
  const form = `<div class="card b-form">
    <div><div class="b-lab"><span class="flabel">Amount</span>${fiatLink()}</div>
      <div class="b-amt">${amountInput()}<span class="code">${S.fiat}</span></div>
      <div class="limits" data-k="limits" style="margin-top:6px"></div></div>
    <div class="track">${chips()}</div>
    <div>${methods().length > 1 ? payRow('Payment method') : `<div class="flabel" style="margin-bottom:8px">Payment method</div>${payRow()}`}</div>
    <div><div class="flabel" style="margin-bottom:8px">Receive to</div>${walletRow()}</div>
  </div>`;
  const w = wallet();
  const delivery = `<div class="sec">Delivery</div><div class="b-rows rows lined">
      <div class="r"><span class="k">Asset</span><span class="v">GNUS · Genius AI</span></div>
      <div class="r"><span class="k">To</span><span class="v">${w ? `${w.name} · <span class="mono">${short(w.addr)}</span>` : '-'}</span></div>
      <div class="r"><span class="k">Paid with</span><span class="v">${methods().length === 1 ? 'Card' : M[S.method].name}</span></div></div>`;
  const quoteRows = `<div class="sec">Quote</div><div class="b-rows rows lined">
      <div class="r"><span class="k">You pay</span><span class="v" data-k="pay"></span></div>
      <div class="r"><span class="k">Banxa processing fee</span><span class="v" data-k="proc"></span></div>
      <div class="r"><span class="k">Network fee</span><span class="v" data-k="net"></span></div>
      <div class="r"><span class="k">Rate</span><span class="v" data-k="rate"></span></div></div>`;
  if (!mob) {
    const rcpt = `<div class="card b-rcpt">
      <div class="b-hero"><div class="b-ico">${gnusIcon()}</div><div class="flabel">You get</div>
        <div><span class="n" data-k="gotFull"></span></div>
        <div class="b-live"><span class="qmeta" data-k="age"></span></div></div>
      ${quoteRows}${delivery}
      <div style="margin-top:20px">${cta()}</div>${fine()}</div>`;
    return { inner:`<div class="b-grid">${form}${rcpt}</div>`, foot:'' };
  }
  const rcpt = `<div class="card b-rcpt">
    <div class="b-sum">${gnusIcon()}<div class="grow"><div class="flabel">You get</div><div><span class="n" data-k="gotFull"></span></div></div>
      <button class="link b-toggle ${S.feesOpen ? 'open' : ''}" onclick="toggleFees()">Details${I.caret}</button></div>
    <div style="margin-top:8px"><span class="qmeta" data-k="age"></span></div>
    ${S.feesOpen ? quoteRows + delivery : ''}</div>`;
  return { inner:`<div class="b-mob"><div class="b-grid">${form}${rcpt}</div></div>`, foot:cta() + fine() };
}

// ---------------- C · Big number ----------------
function vC(mob) {
  const dec = C(S.fiat).fx < 100;
  const keys = ['1','2','3','4','5','6','7','8','9', dec ? '.' : '', '0', 'del'];
  const keypad = `<div class="c-keys">${keys.map(k => k === '' ? '<span></span>'
    : `<button onclick="key('${k}')" aria-label="${k === 'del' ? 'Delete' : k}">${k === 'del' ? I.del : k}</button>`).join('')}</div>`;
  const heroInput = mob
    ? `<span class="amt-txt" data-k="amtText"></span><span class="caret"></span>`
    : amountInput();
  const sym = money(0, S.fiat, { min:0, max:0 }).replace(/[\d.,\s]/g, '');
  const inner = `<div class="${mob ? 'c-mob' : ''}"><div class="c-col">
    <div class="c-pay"><span class="flabel">You pay</span><span class="flabel">·</span>${fiatLink()}</div>
    <div class="c-hero"><span class="sym">${sym}</span>${heroInput}</div>
    <div class="limits" data-k="limits"></div>
    <div class="c-get">${gnusIcon()}<span class="flabel">You get</span><span class="n" data-k="gotFull"></span></div>
    <div style="margin-top:8px"><span class="qmeta" data-k="age"></span></div>
    <div class="c-chips">${chips()}</div>
    <div class="c-meta">
      <div class="mr">${walletRow({ t:'To', w:64 })}</div>
      <div class="mr"><span class="k">Pay with</span><div style="flex:1">${payRow()}</div></div>
      <div class="mr"><span class="k">Fees</span><span class="num" data-k="fees" style="font:500 14px/20px var(--font)"></span>
        <button class="link b-toggle ${S.feesOpen ? 'open' : ''}" style="margin-left:auto" onclick="toggleFees()">Details${I.caret}</button></div>
      ${S.feesOpen ? `<div class="c-fees">${feeRows()}</div>` : ''}
    </div>
    ${mob ? keypad : `<div style="margin-top:22px">${cta()}</div>${fine()}`}
  </div></div>`;
  return { inner, foot:mob ? cta() + fine() : '' };
}

const LEDE = {
  a:'<b>A · Compact card.</b> One narrow card, amount first, like MetaMask or Phantom. Same card centred on desktop. Closest to today\'s <code>GWCard</code> form.',
  b:'<b>B · Form + live receipt.</b> Inputs left, a live receipt right that reads like the 031 receipt. On mobile the receipt collapses to one line under the form.',
  c:'<b>C · Big number.</b> The amount you type is the hero; "You get" sits right under it. On mobile a keypad replaces the system keyboard.',
};

// ---------------- frame + render ----------------
function drawerLayer() {
  return `<div class="dlayer" id="dlayer"><div class="scrim" onclick="closeDrawer()"></div><div class="dpanel">
    <div class="dhead"><span class="dtitle" id="dtitle"></span><button class="iconbtn" onclick="closeDrawer()" aria-label="Close">${I.x}</button></div>
    <div class="dbody" id="dbody"></div><div class="dfoot" id="dfoot"></div></div></div>`;
}
function render() {
  const mob = S.vp === 'mobile';
  const { inner, foot } = ({ a:vA, b:vB, c:vC })[S.v](mob);
  const w = wallet();
  let html;
  if (mob) {
    html = `<div class="phone" id="root"><div class="sbar">9:41</div>
      <div class="abar"><button class="iconbtn" onclick="toast('Back to Home')" aria-label="Back">${I.back}</button><span class="t">Buy GNUS</span></div>
      <div class="scroll">${inner}</div>${foot ? `<div class="mfoot">${foot}</div>` : ''}${drawerLayer()}</div>`;
  } else {
    const center = S.v !== 'b' ? 'center' : '';
    html = `<div class="win" id="root"><div class="navbar"><span class="logo"></span>
      <span>Dashboard</span><span>Transactions</span><span>Swap</span><span>Markets</span><span>News</span><span>Web</span>
      <div class="right"><button class="acct" onclick="openAccounts()">${w ? avatar(w, 24) + `<span>${w.name}</span>` : '<span>You have no wallets!</span>'}${I.caret}</button></div></div>
      <div class="page"><div style="${S.v === 'b' ? 'max-width:964px;margin:0 auto' : S.v === 'a' ? 'width:440px;margin:0 auto' : 'width:480px;margin:0 auto'}">
        <button class="back" onclick="toast('Back to Dashboard')">${I.back}BACK</button><h1 class="ptitle">Buy GNUS</h1></div>
      ${inner}</div>${drawerLayer()}</div>`;
  }
  document.getElementById('stage').innerHTML = html;
  document.getElementById('lede').innerHTML = LEDE[S.v];
  document.querySelectorAll('.vt').forEach(b => b.classList.toggle('active', b.dataset.v === S.v));
  document.querySelectorAll('[data-vp]').forEach(b => b.classList.toggle('on', b.dataset.vp === S.vp));
  document.querySelectorAll('[data-th]').forEach(b => b.classList.toggle('on', b.dataset.th === S.theme));
  if (S.drawer) {
    openDrawer(S.drawer, true);
  }
  bind();
}

// Updates only the live values, so typing never loses focus and the quote tick never re-renders layout.
function bind() {
  const st = status(), q = st.q, root = document.getElementById('stage');
  const noQuote = !!st.amountErr;
  const loading = st.quoting;
  const dim = S.refreshing || st.stale;
  const put = (k, text) => root.querySelectorAll(`[data-k="${k}"]`).forEach(el => {
    el.textContent = noQuote ? '-' : text;
    el.classList.toggle('skel', loading && !noQuote);
    el.classList.toggle('dim', dim && !loading && !noQuote);
  });
  put('got', gn(q.got));
  put('gotFull', `~${gn(q.got)} GNUS`);
  put('pay', money(q.amt, S.fiat));
  put('proc', money(q.proc, S.fiat));
  put('net', money(q.net, S.fiat));
  put('fees', `${money(q.proc + q.net, S.fiat)} incl. network`);
  put('rate', `1 GNUS = ${money(q.priceF, S.fiat, { min:2, max:q.priceF < 1 ? 4 : 2 })}`);

  root.querySelectorAll('[data-k="limits"]').forEach(el => {
    const lim = `Min ${money(q.min, S.fiat, { min:0, max:0 })} · Max ${money(q.max, S.fiat, { min:0, max:0 })}`;
    el.textContent = st.amountErr === 'min' ? `Minimum is ${money(q.min, S.fiat, { min:0, max:0 })}`
      : st.amountErr === 'max' ? `Maximum is ${money(q.max, S.fiat, { min:0, max:0 })}` : lim;
    el.classList.toggle('err', st.amountErr === 'min' || st.amountErr === 'max');
  });
  root.querySelectorAll('[data-k="chip"]').forEach(el => el.classList.toggle('on', parseFloat(el.dataset.v) === q.amt));
  root.querySelectorAll('[data-k="amtInput"]').forEach(el => {
    if (document.activeElement !== el && el.value !== S.amount) {
      el.value = S.amount;
    }
    if (S.v === 'c') {
      fitHero(el);
    }
  });
  root.querySelectorAll('[data-k="amtText"]').forEach(el => {
    el.textContent = S.amount ? Number(S.amount.split('.')[0]).toLocaleString('en-US') + (S.amount.includes('.') ? '.' + S.amount.split('.')[1] : '') : '0';
    el.style.color = S.amount ? '' : 'var(--text-primary-38)';
    fitHero(el);
  });
  bindAge(st);

  root.querySelectorAll('[data-k="cta"]').forEach(el => {
    let label = 'Buy GNUS', off = false;
    if (st.noWallet) { label = 'Add a wallet to buy'; off = true; }
    else if (st.amountErr === 'empty') { label = 'Enter an amount'; off = true; }
    else if (st.amountErr === 'min') { label = `Enter at least ${money(q.min, S.fiat, { min:0, max:0 })}`; off = true; }
    else if (st.amountErr === 'max') { label = `Enter at most ${money(q.max, S.fiat, { min:0, max:0 })}`; off = true; }
    else if (st.quoting) { label = 'Getting quote...'; off = true; }
    else if (st.stale) { label = 'Refresh quote'; }
    if (S.busy) {
      el.innerHTML = '<span class="spinner"></span>Opening Banxa checkout';
      el.classList.add('busy');
      return;
    }
    el.textContent = label;
    el.disabled = off;
    el.classList.remove('busy');
  });
}
function bindAge(st = status()) {
  const rem = Math.max(0, 10 - (Date.now() - S.updated) / 1000);
  const kind = st.amountErr ? 'none' : st.quoting ? 'quoting' : st.stale ? 'stale' : 'live';
  document.querySelectorAll('#stage [data-k="age"]').forEach(el => {
    let txt;
    // Rewrite the markup only when the kind changes; the 250ms tick would otherwise restart spinners and eat clicks.
    if (el.dataset.kind !== kind) {
      el.dataset.kind = kind;
      el.classList.toggle('stale', kind === 'stale');
      el.innerHTML = kind === 'none' ? ''
        : kind === 'quoting' ? '<span class="spinner" style="width:14px;height:14px"></span>Getting quote from Banxa'
        : kind === 'stale' ? 'Quote out of date <button class="link" onclick="refreshNow()">Refresh</button>'
        : ring() + '<span></span>';
    }
    if (kind !== 'live') { return; }
    if (S.refreshing) { txt = 'Refreshing quote'; }
    else if (S.v === 'c') { txt = `Updated ${Math.floor(10 - rem)}s ago`; }
    else if (S.v === 'b') { txt = `Live quote · refreshes in ${Math.ceil(rem)}s`; }
    else { txt = `New quote in ${Math.ceil(rem)}s`; }
    el.querySelector('span').textContent = txt;
    const r = el.querySelector('.ring');
    r.classList.toggle('spin', S.refreshing);
    r.querySelector('.fg').setAttribute('stroke-dashoffset', S.refreshing ? 28 : (40.84 * (1 - rem / 10)).toFixed(2));
  });
}
function fitHero(el) {
  const len = (el.value ?? el.textContent).length || 1;
  const mob = S.vp === 'mobile';
  const size = len <= 5 ? (mob ? 64 : 72) : len <= 7 ? (mob ? 52 : 60) : len <= 9 ? (mob ? 42 : 48) : (mob ? 34 : 38);
  el.style.fontSize = size + 'px';
  if (el.tagName === 'INPUT') {
    el.style.width = (len + 0.6) + 'ch';
  }
}

// ---------------- quote lifecycle ----------------
let requoteT;
function requote() {
  clearTimeout(requoteT);
  if (S.mode !== 'normal' && S.mode !== 'nowallet') { bind(); return; }
  S.refreshing = true;
  bind();
  requoteT = setTimeout(() => { S.refreshing = false; S.updated = Date.now(); bind(); flash(); }, 550);
}
function refreshNow() {
  if (S.mode === 'stale') {
    S.mode = 'normal';
    syncMode();
  }
  S.price = USD_PRICE * (1 + (Math.random() - .5) * .006);
  requote();
}
function flash() {
  document.querySelectorAll('#stage [data-k="got"], #stage [data-k="gotFull"]').forEach(el => {
    el.classList.remove('flash');
    void el.offsetWidth;
    el.classList.add('flash');
  });
}
setInterval(() => {
  const st = status();
  if ((S.mode === 'normal' || S.mode === 'nowallet') && !st.amountErr && !S.refreshing && Date.now() - S.updated >= 10000) {
    S.price = USD_PRICE * (1 + (Math.random() - .5) * .006);
    S.refreshing = true;
    bind();
    setTimeout(() => { S.refreshing = false; S.updated = Date.now(); bind(); flash(); }, 800);
    return;
  }
  bindAge(st);
}, 250);

// ---------------- actions ----------------
function setVariant(v) { S.v = v; S.feesOpen = false; S.drawer = null; render(); }
function setVp(vp) { S.vp = vp; S.drawer = null; render(); }
function setTheme(t) { S.theme = t; document.documentElement.setAttribute('data-theme', t); render(); }
function setMode(m) {
  S.drawer = null;
  if (m === 'belowmin') {
    S.mode = 'normal';
    S.amount = String(sig2(MIN_USD * C(S.fiat).fx * 0.5, 'floor'));
  } else {
    if (status().amountErr) {
      S.amount = String(presets()[1]);
    }
    S.mode = m;
  }
  S.updated = Date.now();
  syncMode();
  render();
}
function syncMode() {
  const st = status();
  const active = S.mode !== 'normal' ? S.mode : st.amountErr === 'min' ? 'belowmin' : 'normal';
  document.querySelectorAll('.st').forEach(b => b.classList.toggle('on', b.dataset.m === active));
}
function setAmt(v) { S.amount = String(v); requote(); syncMode(); }
function typeAmt(el) {
  const dec = C(S.fiat).fx < 100;
  let v = el.value.replace(/[^\d.]/g, '');
  if (!dec) { v = v.replace(/\./g, ''); }
  const p = v.split('.');
  if (p.length > 2) { v = p[0] + '.' + p.slice(1).join(''); }
  if (v.includes('.')) { v = v.split('.')[0] + '.' + v.split('.')[1].slice(0, 2); }
  if (v !== el.value) { el.value = v; }
  S.amount = v;
  requote();
  syncMode();
}
function key(k) {
  let v = S.amount;
  if (k === 'del') { v = v.slice(0, -1); }
  else if (k === '.') { if (!v.includes('.')) { v = (v || '0') + '.'; } }
  else if (v.includes('.') && v.split('.')[1].length >= 2) { return; }
  else if (v.replace('.', '').length >= 9) { return; }
  else { v = v === '0' ? k : v + k; }
  S.amount = v;
  requote();
  syncMode();
}
function setMethod(m) { S.method = m; render(); requote(); }
function toggleFees() { S.feesOpen = !S.feesOpen; render(); }
function buy() {
  const st = status();
  if (st.stale) { refreshNow(); return; }
  S.busy = true;
  bind();
  setTimeout(() => { S.busy = false; bind(); toast(`Banxa checkout opens with ${gn(st.q.got)} GNUS to ${short(wallet().addr)} prefilled. Sketch ends here.`); }, 1300);
}
function addWallet() { S.mode = 'normal'; S.drawer = null; syncMode(); render(); toast('Wallet added. It is now the Selected wallet.'); }

// ---------------- drawers ----------------
function openDrawer(kind, instant) {
  S.drawer = kind;
  const layer = document.getElementById('dlayer');
  const title = document.getElementById('dtitle'), body = document.getElementById('dbody'), foot = document.getElementById('dfoot');
  if (kind === 'currency') {
    title.textContent = 'Currency';
    body.innerHTML = `<label class="search">${I.search}<input id="cq" placeholder="Search 29 currencies" oninput="S.q=this.value;fillCurrencies()" value="${S.q}"></label><div id="clist"></div>`;
    foot.innerHTML = '';
    fillCurrencies();
  } else {
    title.textContent = 'Accounts';
    const w = S.mode === 'nowallet' ? [] : WALLETS;
    body.innerHTML = w.length ? w.map((x, i) => `<button class="srow ${i === S.wallet ? 'sel' : ''}" onclick="pickWallet(${i})">${avatar(x, 32)}
        <span class="tx"><b>${x.name}</b><span class="mono">${short(x.addr)}</span></span>${i === S.wallet ? I.check : ''}</button>`).join('')
      : '<div class="empty">You have no wallets!</div>';
    foot.innerHTML = `<button class="cta" style="background:transparent;border:1px solid var(--border-strong);color:var(--text-primary)" onclick="addWallet()">Add wallet</button>`;
  }
  if (instant) {
    layer.classList.add('open');
  } else {
    requestAnimationFrame(() => layer.classList.add('open'));
  }
  if (kind === 'currency' && !instant) {
    setTimeout(() => document.getElementById('cq')?.focus(), 260);
  }
}
function fillCurrencies() {
  const q = S.q.trim().toLowerCase();
  const list = CUR.filter(c => !q || c[0].toLowerCase().includes(q) || c[1].toLowerCase().includes(q));
  document.getElementById('clist').innerHTML = list.length ? list.map(c => {
    const n = EXTRA[c[0]] ? 1 + EXTRA[c[0]].length : 1;
    return `<button class="srow ${c[0] === S.fiat ? 'sel' : ''}" onclick="pickCurrency('${c[0]}')"><span class="badge">${c[0]}</span>
      <span class="tx"><b>${c[1]}</b><span>${n > 1 ? ['Card', ...EXTRA[c[0]].map(m => M[m].name)].join(', ') : 'Card'}</span></span>${c[0] === S.fiat ? I.check : ''}</button>`;
  }).join('') : `<div class="empty">No currency matches "${S.q.replace(/</g, '&lt;')}"</div>`;
}
function openCurrency() { S.q = ''; openDrawer('currency'); }
function openAccounts() { openDrawer('accounts'); }
function closeDrawer() {
  S.drawer = null;
  document.getElementById('dlayer')?.classList.remove('open');
}
function pickCurrency(code) {
  closeDrawer();
  setTimeout(() => {
    S.fiat = code;
    if (!methods().includes(S.method)) { S.method = 'card'; }
    S.amount = String(presets()[1]);
    render();
    requote();
    syncMode();
  }, 180);
}
function pickWallet(i) {
  closeDrawer();
  setTimeout(() => { S.wallet = i; render(); toast(`GNUS will go to ${WALLETS[i].name}`); }, 180);
}

let tt;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(tt);
  tt = setTimeout(() => el.classList.remove('show'), 2600);
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeDrawer(); } });

render();
syncMode();
</script>
</body>
</html>
