<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markets header — trailing options</title>
<link rel="stylesheet" href="../themes/default.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--surface-base); color: var(--text-primary); padding: var(--space-10); min-height: 100vh; }
  .toolbar { display:flex; gap:var(--space-6); align-items:center; max-width:560px; margin:0 auto var(--space-8); flex-wrap:wrap; }
  .toolbar h1 { font:600 15px/22px var(--font); margin-right:auto; }
  .seg { display:flex; background:var(--surface-menu); border-radius:var(--radius-pill); padding:3px; gap:2px; }
  .seg button { font:500 13px/18px var(--font); padding:6px 13px; border:0; border-radius:var(--radius-pill); background:transparent; color:var(--text-secondary); cursor:pointer; }
  .seg button[aria-pressed="true"] { background:var(--surface-elevated); color:var(--text-primary); box-shadow:var(--shadow-card); }
  .caption { max-width:560px; margin:0 auto var(--space-6); color:var(--text-secondary); font:400 13px/20px var(--font); }
  .caption b { color:var(--text-primary); }

  .panel { max-width:560px; margin:0 auto; background:linear-gradient(to bottom,var(--surface-sheen-a),var(--surface-sheen-b)); border:1px solid var(--border-subtle); border-radius:var(--radius-lg); box-shadow:var(--shadow-card); padding:var(--space-6); }
  .phead { display:flex; align-items:center; min-height:44px; padding:0 var(--space-4) var(--space-8); }
  .phead h2 { font:600 18px/24px var(--font); letter-spacing:-.2px; margin-right:auto; }

  /* trailing options */
  .viewall { display:inline-flex; align-items:center; gap:4px; font:600 13px/1 var(--font); color:var(--brand-primary); cursor:pointer; }
  [data-theme="light"] .viewall { color:var(--brand-primary-strong); }
  .viewall:hover { gap:7px; }
  .pulse { display:inline-flex; align-items:center; gap:10px; font:600 13px/1 var(--font); font-variant-numeric:tabular-nums; }
  .pulse .up { color:var(--status-success); } .pulse .down { color:var(--status-error); }
  .live { display:inline-flex; align-items:center; gap:6px; font:500 12px/1 var(--font); color:var(--text-secondary); text-transform:uppercase; letter-spacing:.06em; }
  .live .dot { width:7px; height:7px; border-radius:50%; background:var(--status-success); box-shadow:0 0 0 0 rgba(10,216,156,.6); animation:pp 1.8s infinite; }
  @keyframes pp { 0%{box-shadow:0 0 0 0 rgba(10,216,156,.55)} 70%{box-shadow:0 0 0 6px rgba(10,216,156,0)} 100%{box-shadow:0 0 0 0 rgba(10,216,156,0)} }
  .old { font:400 13px/18px var(--font); color:var(--text-secondary); }

  .row { display:flex; align-items:center; gap:var(--space-6); padding:var(--space-6) var(--space-4); }
  .row + .row { border-top:1px solid var(--border-subtle); }
  .ic { width:30px; height:30px; border-radius:50%; flex:none; }
  .ic.a{background:linear-gradient(135deg,#14C8FF,#2BF5B4)}.ic.b{background:#F7931A}.ic.c{background:#627EEA}
  .nm { flex:1; font:500 14px/18px var(--font); } .nm small{display:block;color:var(--text-secondary);font-weight:400;font-size:12px}
  .rt { display:flex; align-items:center; gap:10px; }
  .chip { font:600 12px/16px var(--font); padding:2px 7px; border-radius:8px; }
  .chip.u{color:var(--status-success);background:var(--status-success-fill)} .chip.d{color:var(--status-error);background:var(--status-error-fill)}
</style>
</head>
<body>
<div class="toolbar">
  <h1>Markets header — trailing</h1>
  <div class="seg" role="group" aria-label="Option">
    <button data-o="viewall" aria-pressed="true">A · View all ★</button>
    <button data-o="pulse" aria-pressed="false">B · Up/down pulse</button>
    <button data-o="live" aria-pressed="false">C · Live</button>
    <button data-o="none" aria-pressed="false">D · Nothing</button>
    <button data-o="old" aria-pressed="false">Old</button>
  </div>
  <div class="seg" role="group" aria-label="Theme">
    <button data-theme-btn="dark" aria-pressed="true">Dark</button>
    <button data-theme-btn="light" aria-pressed="false">Light</button>
  </div>
</div>
<p class="caption" data-caption></p>
<div class="panel">
  <div class="phead"><h2>Markets</h2><span data-trail></span></div>
  <div class="row"><div class="ic a"></div><div class="nm">GENIUS AI<small>$0.744</small></div><div class="rt"><svg width="52" height="18"><polyline points="0,12 10,10 20,13 30,9 40,11 52,6" fill="none" stroke="var(--status-success)" stroke-width="1.6"/></svg><span class="chip u">+6.7%</span></div></div>
  <div class="row"><div class="ic b"></div><div class="nm">Bitcoin<small>$65,743</small></div><div class="rt"><svg width="52" height="18"><polyline points="0,13 10,11 20,12 30,8 40,9 52,5" fill="none" stroke="var(--status-success)" stroke-width="1.6"/></svg><span class="chip u">+2.6%</span></div></div>
  <div class="row"><div class="ic c"></div><div class="nm">Ethereum<small>$1,931</small></div><div class="rt"><svg width="52" height="18"><polyline points="0,10 10,12 20,9 30,11 40,7 52,8" fill="none" stroke="var(--status-error)" stroke-width="1.6"/></svg><span class="chip d">-0.2%</span></div></div>
</div>

<script>
  const TRAIL = {
    viewall:'<span class="viewall">View all <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>',
    pulse:'<span class="pulse"><span class="up">▲ 6</span><span class="down">▼ 2</span></span>',
    live:'<span class="live"><span class="dot"></span>Live</span>',
    none:'',
    old:'<span class="old">Top 8 · 24h</span>',
  };
  const CAP = {
    viewall:'<b>A · View all → (recommended).</b> The dashboard Markets panel is a PREVIEW of the full <code>/markets</code> screen — so the trailing should take you there. Turns filler into the one useful action. Standard dashboard-widget pattern.',
    pulse:'<b>B · Up/down pulse.</b> A quick market read — how many of the shown coins are up vs down (▲6 ▼2). Adds a summary, but it partly repeats what the row colors already show.',
    live:'<b>C · Live.</b> A pulsing dot + "Live" signalling the 1-min auto-refresh — reassures the numbers are fresh. Subtle, ambient; adds trust rather than info.',
    none:'<b>D · Nothing.</b> Just "Markets". Cleanest, but wastes the slot the other panels (Assets total) use.',
    old:'<b>Old — "Top 8 · 24h".</b> The filler being replaced: restates what\'s obviously visible.',
  };
  const t=document.querySelector('[data-trail]'), cap=document.querySelector('[data-caption]');
  function set(o){ t.innerHTML=TRAIL[o]; cap.innerHTML=CAP[o]; }
  document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>{
    b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
    if(b.dataset.o) set(b.dataset.o);
    if(b.dataset.themeBtn) document.documentElement.dataset.theme=b.dataset.themeBtn;
  }));
  set('viewall');
</script>
</body>
</html>
