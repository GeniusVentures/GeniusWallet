<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sketch 037 — Web tab · Złożone chrome (adres + karty)</title>
<link rel="stylesheet" href="../themes/default.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--surface-base); color: var(--text-primary); }
  svg { display: block; }

  #variant-nav { position: fixed; top: 0; left: 0; right: 0; z-index: 60;
    background: var(--surface-elevated); border-bottom: 1px solid var(--border-subtle);
    padding: 10px 16px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #variant-nav .brand { font-weight: 700; font-size: 13px; letter-spacing: .04em; color: var(--text-secondary); margin-right: 4px; }
  #variant-nav .sep { width: 1px; height: 20px; background: var(--border-subtle); margin: 0 4px; }
  .variant-tab { font: 500 13px var(--font); color: var(--text-primary-70); background: transparent;
    border: 1px solid var(--border-subtle); border-radius: var(--radius-pill); padding: 6px 14px; cursor: pointer; transition: all .15s ease; }
  .variant-tab:hover { color: var(--text-primary); border-color: var(--border-strong); transform: translateY(-1px); }
  .variant-tab.active { color: var(--text-on-brand); background: var(--brand-primary); border-color: var(--brand-primary); }
  .variant-tab .k { font-size: 11px; opacity: .7; }
  .note { margin-left: auto; color: var(--text-secondary); font-size: 12px; }

  .stage { position: fixed; inset: 52px 0 0 0; overflow: hidden; }
  .variant { display: none; position: absolute; inset: 0; flex-direction: column; }
  .variant.active { display: flex; }

  /* ===== navbar (shared) ===== */
  .navbar { flex: none; height: 62px; display: flex; align-items: center; gap: 16px; padding: 0 20px;
    background: var(--surface-elevated); border-bottom: 1px solid var(--border-subtle); }
  .logo { width: 32px; height: 32px; border-radius: 9px; background: linear-gradient(135deg, var(--brand-cta-b), var(--brand-cta-a)); display: grid; place-items: center; }
  .logo svg { width: 19px; height: 19px; color: #001018; }
  .navtabs { display: flex; gap: 2px; }
  .navtab { padding: 0 11px; height: 42px; display: flex; align-items: center; gap: 6px; border-radius: 10px;
    color: var(--text-primary-54); font: 500 13px var(--font); position: relative; }
  .navtab svg { width: 15px; height: 15px; }
  .navtab.on { color: var(--text-primary); }
  .navtab.on::after { content:""; position:absolute; left:9px; right:9px; bottom:-10px; height:3px; border-radius:3px;
    background: linear-gradient(90deg, var(--brand-cta-b), var(--brand-cta-a)); box-shadow: 0 0 10px rgba(20,200,255,.55); }
  .cluster { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .chip { display: flex; align-items: center; gap: 7px; height: 36px; padding: 0 11px; background: var(--surface-menu);
    border: 1px solid var(--border-subtle); border-radius: 10px; color: var(--text-primary); font: 500 12px var(--font); cursor: pointer; }
  .chip.mono { font-family: var(--font-mono); font-size: 11px; }
  .chip .dot { width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; font-size: 9px; }
  .cluster .btn-outline { height: 36px; padding: 0 14px; border: 1px solid var(--brand-primary); border-radius: 10px;
    background: transparent; color: var(--brand-primary); font: 600 12px var(--font); cursor: pointer; }
  .cluster .btn-cta { height: 36px; padding: 0 16px; border: none; border-radius: 10px; cursor: pointer;
    background: linear-gradient(90deg, var(--brand-cta-b), var(--brand-cta-a)); color: #001018; font: 700 12px var(--font); }

  /* ===== 036-A tab strip (shared by both) ===== */
  .stripwrap { flex: none; background: var(--surface-base); border-bottom: 1px solid var(--border-subtle);
    display: flex; align-items: flex-end; gap: 4px; padding: 8px 12px 0; overflow-x: auto; }
  .stab { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 8px 0 12px; min-width: 150px; max-width: 220px;
    border-radius: 10px 10px 0 0; background: transparent; color: var(--text-primary-54); cursor: pointer; position: relative;
    transition: all .15s ease; flex: 0 0 auto; }
  .stab:hover { background: var(--border-subtle); color: var(--text-primary); }
  .stab.on { background: var(--surface-elevated); color: var(--text-primary); }
  .stab.on::after { content:""; position:absolute; left:12px; right:12px; bottom:0; height:2px;
    background: linear-gradient(90deg, var(--brand-cta-b), var(--brand-cta-a)); }
  .stab .fav { width: 16px; height: 16px; border-radius: 4px; flex: none; display: grid; place-items: center; font-size: 10px; }
  .stab .ttl { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font: 500 13px var(--font); }
  .stab .x { width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center; color: var(--text-primary-38); flex: none; }
  .stab .x:hover { background: var(--border-strong); color: var(--text-primary); }
  .stab .x svg { width: 12px; height: 12px; }
  .newtab { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; color: var(--text-primary-70);
    cursor: pointer; flex: none; margin-bottom: 2px; transition: all .15s ease; }
  .newtab:hover { background: var(--brand-primary-subtle); color: var(--brand-primary); }
  .newtab svg { width: 18px; height: 18px; }

  /* ===== shared control + field bits ===== */
  .ico { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; color: var(--text-primary-70);
    cursor: pointer; border: none; background: transparent; transition: all .15s ease; }
  .ico:hover { background: var(--border-subtle); color: var(--text-primary); }
  .ico svg { width: 17px; height: 17px; }
  .ico.brand { color: var(--brand-primary); }
  .ico[disabled] { color: var(--text-primary-38); }
  .fav2 { width: 17px; height: 17px; border-radius: 5px; flex: none; display: grid; place-items: center; font-size: 10px; }
  .lock { width: 13px; height: 13px; color: var(--status-success); flex: none; }
  .host { color: var(--text-primary); font: 500 13px var(--font); }
  .editurl { flex: 1; border: none; background: transparent; outline: none; color: var(--text-primary); font: 500 13px var(--font); height: 100%; }
  .editurl::placeholder { color: var(--text-primary-38); }

  /* ===== 035-A dedicated re-skinned bar ===== */
  .barA { flex: none; height: 50px; display: flex; align-items: center; gap: 8px; padding: 0 16px;
    background: var(--surface-elevated); border-bottom: 1px solid var(--border-subtle); position: relative; }
  .barA::after { content:""; position:absolute; left:16px; right:16px; bottom:-1px; height:1px; background: var(--brand-primary-subtle); }
  .barA .fieldA { flex: 1; height: 36px; border-radius: var(--radius-pill); background: var(--surface-sunken);
    border: 1px solid transparent; display: flex; align-items: center; gap: 9px; padding: 0 14px; cursor: text; transition: all .15s ease; }
  .barA .fieldA.focus { background: var(--surface-elevated); border-color: var(--brand-primary); box-shadow: 0 0 0 3px var(--brand-primary-subtle); }
  .barA .fieldA .star { margin-left: auto; color: var(--text-primary-38); width: 16px; height: 16px; cursor: pointer; }
  .barA .fieldA .star:hover { color: var(--brand-primary); }

  /* ===== 035-B unified omnibox toolbar ===== */
  .barB { flex: none; height: 54px; display: flex; align-items: center; gap: 10px; padding: 0 16px;
    background: var(--surface-elevated); border-bottom: 1px solid var(--border-subtle); }
  .barB .omni { flex: 1; height: 38px; border-radius: var(--radius-pill); background: var(--surface-sunken);
    border: 1px solid var(--border-subtle); display: flex; align-items: center; padding: 0 4px; gap: 3px; transition: all .15s ease; }
  .barB .omni.focus { border-color: var(--brand-primary); box-shadow: 0 0 0 3px var(--brand-primary-subtle); background: var(--surface-elevated); }
  .barB .omni .ico { width: 30px; height: 30px; }
  .barB .omni .ico svg { width: 15px; height: 15px; }
  .barB .omni .divider { width: 1px; height: 18px; background: var(--border-subtle); margin: 0 4px; }
  .barB .omni .addr { flex: 1; display: flex; align-items: center; gap: 8px; height: 100%; padding: 0 6px; cursor: text; }
  .barB .omni .reload { margin-left: auto; }

  /* ===== webview stand-in ===== */
  .webview { flex: 1; min-height: 0; position: relative; overflow: hidden; }
  .site { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
  .site .badge { width: 60px; height: 60px; border-radius: 16px; display: grid; place-items: center; font-size: 30px; }
  .site h1 { font: 700 26px var(--font); color: #fff; }
  .site .bar { width: min(460px,55%); height: 42px; border-radius: 21px; background: rgba(255,255,255,.08);
    display: flex; align-items: center; padding: 0 16px; color: rgba(255,255,255,.5); font-size: 14px; }
  .measure { position: absolute; top: 14px; right: 16px; z-index: 5; background: rgba(0,0,0,.55); color: #fff;
    border-radius: 8px; padding: 5px 10px; font: 600 11px var(--font-mono); letter-spacing: .02em; }

  #sketch-tools { position: fixed; bottom: 12px; right: 12px; z-index: 99; font: 12px system-ui;
    background: rgba(0,0,0,.7); color: #fff; padding: 8px 12px; border-radius: 8px; opacity: .4; transition: opacity .2s; }
  #sketch-tools:hover { opacity: 1; }
  #sketch-tools select { background: #222; color: #fff; border: 1px solid #444; border-radius: 5px; padding: 2px 4px; }
</style>
</head>
<body>

<div id="variant-nav">
  <span class="brand">GSD ▸ 037</span>
  <span class="sep"></span>
  <button class="variant-tab active" onclick="show('a', this)">A · Twój wybór <span class="k">(035-A + 036-A)</span></button>
  <button class="variant-tab" onclick="show('b', this)">B · Rekomendacja ★ Wybrany <span class="k">(035-B + 036-A)</span></button>
  <span class="note">Oba używają paska kart 036-A. Różnica = tylko pasek adresu. Klik adres = fokus, klik kartę = przełącz.</span>
</div>

<div class="stage">
  <!-- ===== A: 035-A dedicated bar + 036-A strip ===== -->
  <section class="variant active" id="v-a">
    <div class="navbar" data-nav></div>
    <div class="stripwrap" data-strip="a"></div>
    <div class="barA">
      <button class="ico brand" title="Wstecz">%BACK%</button>
      <button class="ico" disabled title="Dalej">%FWD%</button>
      <button class="ico" title="Odśwież" onclick="spin(this)">%RELOAD%</button>
      <div class="fieldA" data-field="a" onclick="editField(this,'.host')">
        <span class="fav2" data-fav>🦆</span>%LOCK%<span class="host" data-host>duckduckgo.com</span>
        %STAR%
      </div>
    </div>
    <div class="webview" data-web="a">
      <div class="measure">chrome A ≈ 174px (navbar 62 + strip 46 + adres 50)</div>
    </div>
  </section>

  <!-- ===== B: 035-B unified omnibox + 036-A strip ===== -->
  <section class="variant" id="v-b">
    <div class="navbar" data-nav></div>
    <div class="stripwrap" data-strip="b"></div>
    <div class="barB">
      <div class="omni" data-field="b" onclick="editField(this,'.host')">
        <button class="ico brand" title="Wstecz" onclick="event.stopPropagation()">%BACK%</button>
        <button class="ico" disabled title="Dalej" onclick="event.stopPropagation()">%FWD%</button>
        <span class="divider"></span>
        <div class="addr"><span class="fav2" data-fav>🦆</span>%LOCK%<span class="host" data-host>duckduckgo.com</span></div>
        <button class="ico reload" title="Odśwież" onclick="event.stopPropagation();spin(this)">%RELOAD%</button>
      </div>
      <button class="ico" title="Menu">%MENU%</button>
    </div>
    <div class="webview" data-web="b">
      <div class="measure">chrome B ≈ 178px (navbar 62 + strip 46 + adres 54)</div>
    </div>
  </section>
</div>

<div id="sketch-tools">
  <label>Theme
    <select onchange="document.documentElement.setAttribute('data-theme', this.value)">
      <option value="dark">dark</option><option value="light">light</option>
    </select>
  </label>
</div>

<template id="tpl-nav">
  <div class="logo">%BRAIN%</div>
  <div class="navtabs">
    <div class="navtab">%I_DASH% Dashboard</div>
    <div class="navtab">%I_MKT% Markets</div>
    <div class="navtab">%I_NEWS% News</div>
    <div class="navtab on">%I_WEB% Web</div>
    <div class="navtab">%I_SET% Settings</div>
  </div>
  <div class="cluster">
    <div class="chip"><span class="dot" style="background:#627eea">%ETH%</span>Ethereum</div>
    <div class="chip mono"><span class="dot" style="background:#2a3a5e">🗄</span>0x1d9b…4a87</div>
    <button class="btn-outline">Connect</button>
    <button class="btn-cta">Buy GNUS</button>
  </div>
</template>

<script>
  const I = {
    BACK:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
    FWD:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>',
    RELOAD:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>',
    PLUS:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    X:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    MENU:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>',
    LOCK:'<svg class="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
    STAR:'<svg class="star" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 18l-5.9 3 1.2-6.5L2.5 9.9 9 9z"/></svg>',
    BRAIN:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a4 4 0 0 0-4 4 3 3 0 0 0-1 5.8V17a3 3 0 0 0 5 2 3 3 0 0 0 5-2v-4.2A3 3 0 0 0 16 7a4 4 0 0 0-4-4z"/></svg>',
    ETH:'<svg viewBox="0 0 24 24" width="10" height="10" fill="#fff"><path d="M12 2l6 10-6 3-6-3z" opacity=".85"/><path d="M6 13l6 3 6-3-6 9z"/></svg>',
    DASH:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',
    MKT:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16l5-5 3 3 6-7"/></svg>',
    NEWS:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h6M7 12h10M7 16h10"/></svg>',
    WEB:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg>',
    SET:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.6-2-3.4-2.3 1a7 7 0 0 0-1.7-1L14.5 2h-4l-.4 2.3a7 7 0 0 0-1.7 1l-2.3-1-2 3.4L6 11a7 7 0 0 0 0 2l-2 1.6 2 3.4 2.3-1a7 7 0 0 0 1.7 1l.4 2.4h4l.4-2.3a7 7 0 0 0 1.7-1l2.3 1 2-3.4-2-1.6a7 7 0 0 0 .1-1z"/></svg>'
  };
  function hy(s){ for(const k in I) s=s.replace(new RegExp('%'+k+'%','g'),I[k]);
    return s.replace(/%I_DASH%/g,I.DASH).replace(/%I_MKT%/g,I.MKT).replace(/%I_NEWS%/g,I.NEWS).replace(/%I_WEB%/g,I.WEB).replace(/%I_SET%/g,I.SET); }

  const navHTML = hy(document.getElementById('tpl-nav').innerHTML);
  document.querySelectorAll('[data-nav]').forEach(n => n.innerHTML = navHTML);
  document.querySelectorAll('.barA,.barB').forEach(b => b.innerHTML = hy(b.innerHTML));

  const tabs = [
    { host:'duckduckgo.com', title:'DuckDuckGo — Privacy', short:'DuckDuckGo', emoji:'🦆', bg:'#de5833', g:'radial-gradient(600px 400px at 50% -10%,#101820,#05090f)' },
    { host:'app.uniswap.org', title:'Uniswap Interface',   short:'Uniswap',    emoji:'🦄', bg:'#ff007a', g:'radial-gradient(600px 400px at 50% -10%,#1a0f22,#07050c)' },
    { host:'coingecko.com',   title:'CoinGecko — Prices',   short:'CoinGecko',  emoji:'🦎', bg:'#4bcc00', g:'radial-gradient(600px 400px at 50% -10%,#0d1710,#05090f)' },
  ];
  const state = { a:0, b:0 };

  function renderStrip(which){
    const w = document.querySelector('[data-strip="'+which+'"]'); w.innerHTML='';
    tabs.forEach((t,i)=>{
      const el=document.createElement('div'); el.className='stab'+(i===state[which]?' on':'');
      el.innerHTML=`<span class="fav" style="background:${t.bg}">${t.emoji}</span>
        <span class="ttl">${t.title}</span>
        <span class="x" onclick="event.stopPropagation();closeTab('${which}',${i})">${I.X}</span>`;
      el.onclick=()=>select(which,i); w.appendChild(el);
    });
    const add=document.createElement('div'); add.className='newtab'; add.title='Nowa karta'; add.innerHTML=I.PLUS;
    add.onclick=()=>addTab(which); w.appendChild(add);
  }
  function renderAddr(which){
    const t = tabs[state[which]] || tabs[0];
    const f = document.querySelector('[data-field="'+which+'"]'); if(!f) return;
    f.querySelector('[data-fav]').style.background=t.bg;
    f.querySelector('[data-fav]').textContent=t.emoji;
    f.querySelector('[data-host]').textContent=t.host;
  }
  function renderWeb(which){
    const t = tabs[state[which]] || tabs[0];
    const w = document.querySelector('[data-web="'+which+'"]');
    const keep = w.querySelector('.measure');
    w.innerHTML = `<div class="site" style="background:${t.g}"><div class="badge" style="background:${t.bg}">${t.emoji}</div>
      <h1>${t.short}</h1><div class="bar">${t.host}</div></div>`;
    if(keep) w.appendChild(keep);
  }
  function renderAll(which){ renderStrip(which); renderAddr(which); renderWeb(which); }
  function select(which,i){ state[which]=i; renderAll(which); }
  function closeTab(which,i){ if(tabs.length===1) return; /* mock keeps 3 min for demo */
    if(tabs.length<=1) return; tabs.splice(i,1); if(state[which]>=tabs.length) state[which]=tabs.length-1;
    renderAll('a'); renderAll('b'); }
  function addTab(which){ tabs.push({host:'duckduckgo.com',title:'Nowa karta',short:'Nowa karta',emoji:'🦆',bg:'#de5833',
    g:'radial-gradient(600px 400px at 50% -10%,#101820,#05090f)'}); state[which]=tabs.length-1; renderAll('a'); renderAll('b'); }

  function editField(el, hostSel){
    if(el.dataset.editing) return; el.dataset.editing='1'; el.classList.add('focus');
    const host = el.querySelector(hostSel); const orig = host.textContent;
    host.outerHTML = '<input class="editurl" value="https://'+orig+'">';
    const input = el.querySelector('.editurl'); input.focus(); input.select();
    input.addEventListener('keydown', e=>{ if(e.key==='Enter') input.blur(); });
    input.addEventListener('blur', ()=>{ let v=input.value.trim()||'duckduckgo.com';
      try{ v=new URL(v.includes('://')?v:'https://'+v).host.replace(/^www\./,''); }catch(e){}
      input.outerHTML = '<span class="host" data-host>'+v+'</span>';
      el.classList.remove('focus'); delete el.dataset.editing; });
  }
  function spin(btn){ const s=btn.querySelector('svg'); s.style.transition='transform .5s ease'; s.style.transform='rotate(360deg)';
    setTimeout(()=>{s.style.transition='';s.style.transform='';},520); }
  function show(id,btn){ document.querySelectorAll('.variant').forEach(v=>v.classList.remove('active'));
    document.getElementById('v-'+id).classList.add('active');
    document.querySelectorAll('#variant-nav .variant-tab').forEach(t=>t.classList.remove('active')); btn.classList.add('active'); }

  renderAll('a'); renderAll('b');
</script>
</body>
</html>
