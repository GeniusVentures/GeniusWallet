<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>109 · Markets editorial+ — new components (KPI / movers / sectors / sparks)</title>
<link rel="stylesheet" href="../themes/default.css">
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:var(--font); background:#04050A; color:var(--text-primary); padding:var(--space-10); min-height:100vh; }
  .wrap { max-width:1500px; margin:0 auto; }
  .toolbar { display:flex; gap:var(--space-6); align-items:center; margin-bottom:var(--space-6); flex-wrap:wrap; }
  .toolbar h1 { font:600 15px/22px var(--font); margin-right:auto; letter-spacing:.2px; }
  .toolbar h1 .muted { color:var(--text-secondary); font-weight:400; }
  .tabs { display:flex; gap:2px; background:var(--surface-menu); border-radius:var(--radius-pill); padding:3px; flex-wrap:wrap; }
  .tabs button { font:500 12.5px/18px var(--font); padding:7px 15px; border:0; border-radius:var(--radius-pill);
                 background:transparent; color:var(--text-secondary); cursor:pointer; transition:.16s; }
  .tabs button[aria-pressed="true"] { background:linear-gradient(135deg,var(--brand-primary),var(--brand-secondary)); color:#00121A; font-weight:600; box-shadow:0 2px 12px rgba(20,200,255,.28); }
  p.lede { color:var(--text-secondary); font:400 13px/21px var(--font); margin:0 0 var(--space-8); max-width:940px; }
  p.lede b{ color:var(--text-primary); }
  .variant { display:none; } .variant.on { display:block; }
  .up { color:var(--status-success); } .dn { color:var(--status-error); } .num{ font-variant-numeric:tabular-nums; }
  @keyframes drift { 0%{transform:translate(0,0) scale(1);} 100%{transform:translate(-3%,2%) scale(1.08);} }

  /* shared editorial shell */
  .mag { background:#080A10; border:1px solid var(--border-subtle); border-radius:18px; padding:32px 36px 38px; }
  .masthead { display:flex; align-items:baseline; justify-content:space-between; border-bottom:2px solid var(--text-primary); padding-bottom:15px; }
  .masthead .t { font:600 38px/1 var(--font); letter-spacing:-1.1px; }
  .masthead .meta { font:500 12px/1.5 var(--font); color:var(--text-secondary); text-align:right; }
  .kick { font:700 10px/1 var(--font); letter-spacing:2.4px; text-transform:uppercase; color:var(--brand-secondary); margin:24px 0 14px; }
  .divider { height:1px; background:var(--border-subtle); margin:30px 0 20px; }

  /* featured */
  .feature { display:grid; grid-template-columns:1.15fr 1fr; gap:28px; align-items:center; }
  @media (max-width:860px){ .feature{ grid-template-columns:1fr; } }
  .feature .lead { font:600 28px/1.18 var(--font); letter-spacing:-.5px; max-width:15ch; }
  .feature .lead .accent { color:var(--brand-secondary); }
  .feature .dek { font:400 13.5px/21px var(--font); color:var(--text-secondary); margin:14px 0 18px; max-width:44ch; }
  .fstats { display:flex; gap:24px; }
  .fstats .s .l { font:600 9px/1 var(--font); letter-spacing:1px; text-transform:uppercase; color:var(--text-secondary); }
  .fstats .s .v { font:600 19px/1 var(--font); margin-top:7px; font-variant-numeric:tabular-nums; letter-spacing:-.3px; }
  .fchart { border-radius:14px; overflow:hidden; height:196px; background:linear-gradient(160deg,#0C1119,#080B11); border:1px solid var(--border-subtle); position:relative; }
  .fchart .rng { position:absolute; right:12px; top:12px; display:flex; gap:2px; background:rgba(0,0,0,.35); border-radius:999px; padding:3px; z-index:2; }
  .fchart .rng button { font:600 10px/1 var(--font); color:var(--text-secondary); background:transparent; border:0; padding:5px 9px; border-radius:999px; cursor:pointer; }
  .fchart .rng button.on { background:rgba(255,255,255,.1); color:#fff; }

  /* list rows */
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:0 40px; }
  @media (max-width:860px){ .grid{ grid-template-columns:1fr; } }
  .mrow { display:grid; grid-template-columns:20px 1fr 84px 66px 68px; gap:13px; align-items:center; padding:13px 0; border-bottom:1px solid var(--border-subtle); }
  .mrow.native { background:linear-gradient(90deg,rgba(20,200,255,.06),transparent); }
  .mrow .rk { font:500 11px/1 var(--font); color:var(--text-secondary); }
  .mrow .nm { font:600 14px/1 var(--font); } .mrow .nm small { color:var(--text-secondary); font-weight:500; margin-left:6px; }
  .mrow .pr { font:600 13px/1 var(--font); text-align:right; font-variant-numeric:tabular-nums; }
  .mrow .ch { font:600 12px/1 var(--font); text-align:right; font-variant-numeric:tabular-nums; }
  .mrow svg.mini { width:64px; height:22px; }

  /* NEW COMPONENT: KPI band */
  .kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:22px 0 4px; }
  @media (max-width:760px){ .kpis{ grid-template-columns:repeat(2,1fr); } }
  .kpi { border:1px solid var(--border-subtle); border-radius:14px; padding:15px 16px; background:linear-gradient(160deg,#0B0E15,#090B11); position:relative; overflow:hidden; }
  .kpi .l { font:600 9px/1 var(--font); letter-spacing:1px; text-transform:uppercase; color:var(--text-secondary); }
  .kpi .v { font:600 22px/1 var(--font); margin-top:9px; letter-spacing:-.5px; font-variant-numeric:tabular-nums; }
  .kpi .sub { font:600 11px/1 var(--font); margin-top:7px; font-variant-numeric:tabular-nums; }
  .kpi.gauge { display:flex; align-items:center; gap:14px; }
  .kpi.gauge .txt .state { font:700 13px/1 var(--font); color:var(--status-success); margin-top:4px; }

  /* NEW COMPONENT: top movers rail */
  .rail { display:flex; gap:12px; overflow:auto; padding:2px 0 8px; }
  .mover { flex:0 0 176px; border:1px solid var(--border-subtle); border-radius:14px; padding:13px 14px; background:#0A0E15; position:relative; overflow:hidden; }
  .mover.native { border-color:transparent; background:linear-gradient(#0A0E15,#0A0E15) padding-box, linear-gradient(135deg,var(--brand-primary),var(--brand-secondary)) border-box; border:1px solid transparent; }
  .mover .mtop { display:flex; align-items:center; justify-content:space-between; }
  .mover .tk { font:700 13px/1 var(--font); } .mover .rkk { font:500 9px/1 var(--font); color:var(--text-secondary); }
  .mover .pr { font:600 15px/1 var(--font); margin:10px 0 6px; font-variant-numeric:tabular-nums; }
  .mover .ch { font:700 12px/1 var(--font); font-variant-numeric:tabular-nums; }
  .mover svg.mini { width:100%; height:30px; margin-top:8px; display:block; }
  .railhead { display:flex; align-items:center; justify-content:space-between; }
  .railhead .seg { display:flex; gap:2px; background:var(--surface-menu); border-radius:999px; padding:3px; }
  .railhead .seg button { font:600 10px/1 var(--font); color:var(--text-secondary); background:transparent; border:0; padding:6px 11px; border-radius:999px; cursor:pointer; }
  .railhead .seg button.on { background:rgba(255,255,255,.1); color:#fff; }

  /* NEW COMPONENT: sector pills */
  .sectors { display:flex; gap:8px; flex-wrap:wrap; margin:18px 0 4px; }
  .spill { font:600 12px/1 var(--font); color:var(--text-secondary); background:transparent; border:1px solid var(--border-subtle); padding:8px 14px; border-radius:999px; cursor:pointer; transition:.15s; }
  .spill.on { color:#00121A; background:linear-gradient(135deg,var(--brand-primary),var(--brand-secondary)); border-color:transparent; }
  .spill:hover:not(.on){ border-color:var(--border-strong); color:var(--text-primary); }

  /* NEW COMPONENT: ATH gap bar */
  .athbar { height:5px; border-radius:999px; background:rgba(255,255,255,.08); overflow:hidden; }
  .athbar > i { display:block; height:100%; background:linear-gradient(90deg,#FF4D4D,#FFC42E); border-radius:999px; }

  /* dual feature (variant C) */
  .duo { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:860px){ .duo{ grid-template-columns:1fr; } }
  .fcard2 { border:1px solid var(--border-subtle); border-radius:16px; padding:18px; background:linear-gradient(160deg,#0C1119,#080B11); }
  .fcard2.native { border-color:transparent; background:linear-gradient(#0A0E15,#0A0E15) padding-box, linear-gradient(135deg,var(--brand-primary),var(--brand-secondary)) border-box; border:1px solid transparent; }
  .fcard2 .who { display:flex; align-items:center; gap:10px; }
  .fcard2 .mk { width:34px; height:34px; border-radius:10px; flex:none; }
  .fcard2 .nm { font:600 15px/1 var(--font); } .fcard2 .sy{ font:500 10px/1.4 var(--font); color:var(--text-secondary); }
  .fcard2 .badge { margin-left:auto; font:700 8px/1 var(--font); letter-spacing:1px; text-transform:uppercase; padding:4px 7px; border-radius:6px; background:linear-gradient(135deg,var(--brand-primary),var(--brand-secondary)); color:#00121A; }
  .fcard2 .pr { font:600 30px/1 var(--font); letter-spacing:-1px; margin:14px 0 5px; font-variant-numeric:tabular-nums; }
  .fcard2 .chg { font:600 13px/1 var(--font); } .fcard2 .chart { height:96px; margin-top:12px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="toolbar">
    <h1>109 · Markets editorial+ &nbsp;<span class="muted">— B family + new components</span></h1>
    <div class="tabs" id="tabs">
      <button aria-pressed="true"  data-v="a">A · B refined (+sparks)</button>
      <button aria-pressed="false" data-v="b">B · +KPI band +movers</button>
      <button aria-pressed="false" data-v="c">C · +sectors +dual feature</button>
    </div>
  </div>
  <p class="lede">All three keep the editorial base you liked. Each layers in <b>new components</b> so you can see what earns its place: KPI band (with a Fear &amp; Greed gauge), a top-movers rail, sector pills, per-row sparklines and ATH-gap bars.</p>

  <div class="variant on" id="va"></div>
  <div class="variant" id="vb"></div>
  <div class="variant" id="vc"></div>
</div>

<script>
const COINS = [
  {tk:'BTC', nm:'Bitcoin',   sec:'L1',  mc:1320, pr:'$67,120', ch:+2.4, rank:1,  ath:-12, vol:'$38B', spark:[3,5,4,6,7,6,8]},
  {tk:'ETH', nm:'Ethereum',  sec:'L1',  mc:410,  pr:'$3,412',  ch:-1.1, rank:2,  ath:-28, vol:'$14B', spark:[8,7,7,6,6,5,6]},
  {tk:'SOL', nm:'Solana',    sec:'L1',  mc:78,   pr:'$168',    ch:+11.9,rank:5,  ath:-41, vol:'$5.1B',spark:[3,4,4,5,7,8,9]},
  {tk:'BNB', nm:'BNB',       sec:'L1',  mc:92,   pr:'$598',    ch:+0.8, rank:4,  ath:-14, vol:'$1.2B',spark:[5,5,6,5,6,6,6]},
  {tk:'XRP', nm:'XRP',       sec:'L1',  mc:34,   pr:'$0.62',   ch:-4.7, rank:6,  ath:-82, vol:'$1.8B',spark:[7,6,6,5,4,4,3]},
  {tk:'DOGE',nm:'Dogecoin',  sec:'Meme',mc:23,   pr:'$0.158',  ch:+6.2, rank:8,  ath:-79, vol:'$1.1B',spark:[4,4,5,5,6,7,7]},
  {tk:'GNUS',nm:'GENIUS AI',  sec:'AI', mc:8,    pr:'$0.42',   ch:+8.1, rank:142,ath:-63, vol:'$21M', spark:[3,3,3.5,4,5.5,7,9], native:true},
  {tk:'AVAX',nm:'Avalanche', sec:'L1',  mc:14,   pr:'$36.2',   ch:+4.1, rank:10, ath:-73, vol:'$0.5B',spark:[4,5,5,6,6,7,7]},
  {tk:'LINK',nm:'Chainlink', sec:'DeFi',mc:11,   pr:'$18.4',   ch:+1.2, rank:12, ath:-64, vol:'$0.3B',spark:[5,5,6,6,6,6,7]},
  {tk:'UNI', nm:'Uniswap',   sec:'DeFi',mc:5,    pr:'$9.80',   ch:+5.5, rank:19, ath:-78, vol:'$0.2B',spark:[4,4,5,5,6,6,7]},
  {tk:'TAO', nm:'Bittensor', sec:'AI',  mc:4,    pr:'$412',    ch:+9.3, rank:24, ath:-46, vol:'$0.2B',spark:[3,4,4,5,6,7,8]},
  {tk:'RNDR',nm:'Render',    sec:'AI',  mc:3,    pr:'$7.20',   ch:+3.7, rank:29, ath:-58, vol:'$0.1B',spark:[4,4,5,5,5,6,7]},
];
const sgn = c => (c>=0?'+':'')+c.toFixed(1)+'%';
function areaPath(pts,w,h,pad){ const max=Math.max(...pts),min=Math.min(...pts),R=(max-min)||1,st=w/(pts.length-1);
  const P=pts.map((p,i)=>[i*st,h-pad-((p-min)/R)*(h-2*pad)]); let d='M'+P[0][0]+','+P[0][1];
  for(let i=1;i<P.length;i++){const x0=P[i-1][0],y0=P[i-1][1],x1=P[i][0],y1=P[i][1],cx=(x0+x1)/2; d+=` C${cx},${y0} ${cx},${y1} ${x1},${y1}`;}
  return {line:d,area:d+` L${w},${h} L0,${h} Z`}; }
function chartSVG(pts,w,h,up,id){ const {line,area}=areaPath(pts,w,h,14); const c=up?'#2BF5B4':'#FF4D4D';
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:100%">
    <defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".34"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#${id})"/><path d="${line}" fill="none" stroke="${c}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`; }
function mini(pts,up){ const {line}=areaPath(pts,64,22,3); const c=up?'#2BF5B4':'#FF4D4D';
  return `<svg class="mini" viewBox="0 0 64 22" preserveAspectRatio="none"><path d="${line}" fill="none" stroke="${c}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>`; }
function miniW(pts,up){ const {line,area}=areaPath(pts,150,30,3); const c=up?'#2BF5B4':'#FF4D4D';
  return `<svg class="mini" viewBox="0 0 150 30" preserveAspectRatio="none"><defs><linearGradient id="mw${pts.join('')}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".3"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient></defs><path d="${area}" fill="url(#mw${pts.join('')})"/><path d="${line}" fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`; }
const G = COINS.find(c=>c.native);

// NEW COMPONENT: Fear & Greed semicircle gauge
function fgGauge(val){ const a=Math.PI*(1-val/100); const cx=34,cy=34,r=27;
  const x=cx+r*Math.cos(a), y=cy-r*Math.sin(a);
  return `<svg width="68" height="40" viewBox="0 0 68 40">
    <path d="M7,34 A27,27 0 0,1 61,34" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="6" stroke-linecap="round"/>
    <path d="M7,34 A27,27 0 0,1 61,34" fill="none" stroke="url(#fg)" stroke-width="6" stroke-linecap="round" stroke-dasharray="${(val/100)*85} 200"/>
    <defs><linearGradient id="fg" x1="0" x2="1"><stop offset="0" stop-color="#FF4D4D"/><stop offset=".5" stop-color="#FFC42E"/><stop offset="1" stop-color="#2BF5B4"/></linearGradient></defs>
    <circle cx="${x}" cy="${y}" r="3.5" fill="#fff"/></svg>`; }

const masthead = `<div class="masthead"><div class="t">Markets</div><div class="meta">Thursday · Jul 24<br>Total cap $2.41T · <span class="up">▲3.1%</span></div></div>`;
function featuredBlock(rangeTabs){ const up=G.ch>=0; return `
  <div class="kick">Featured · Native token</div>
  <div class="feature">
    <div><div class="lead">GENIUS <span class="accent">AI</span> leads the desk, up 8.1% on rising volume.</div>
      <div class="dek">The native token outpaced every large cap today, its best 7-day stretch this quarter as momentum broadened across AI names.</div>
      <div class="fstats"><div class="s"><div class="l">Price</div><div class="v">${G.pr}</div></div>
        <div class="s"><div class="l">Rank</div><div class="v">#${G.rank}</div></div>
        <div class="s"><div class="l">ATH gap</div><div class="v dn">${G.ath}%</div></div></div></div>
    <div class="fchart">${rangeTabs?'<div class="rng"><button>24h</button><button class="on">7d</button><button>30d</button><button>1y</button></div>':''}${chartSVG(G.spark,520,196,up,'fc'+(rangeTabs?'r':''))}</div>
  </div>`; }
function listRows(coins,spark){ return coins.map(c=>`<div class="mrow ${c.native?'native':''}">
   <span class="rk">${String(c.rank).padStart(2,'0')}</span>
   <span class="nm">${c.nm}<small>${c.tk}</small></span>
   ${spark?mini(c.spark,c.ch>=0):'<span></span>'}
   <span class="pr">${c.pr}</span>
   <span class="ch ${c.ch>=0?'up':'dn'}">${sgn(c.ch)}</span></div>`).join(''); }

/* ---------- A: B refined + per-row sparklines ---------- */
document.getElementById('va').innerHTML=`<div class="mag">
  ${masthead}
  ${featuredBlock(false)}
  <div class="divider"></div>
  <div class="grid">${listRows([...COINS].sort((a,b)=>a.rank-b.rank),true)}</div>
</div>`;

/* ---------- B: + KPI band + top movers rail ---------- */
(function(){ const gainers=[...COINS].sort((a,b)=>b.ch-a.ch).slice(0,5);
  document.getElementById('vb').innerHTML=`<div class="mag">
    ${masthead}
    <div class="kpis">
      <div class="kpi"><div class="l">Total market cap</div><div class="v">$2.41T</div><div class="sub up">▲ 3.1% 24h</div></div>
      <div class="kpi"><div class="l">24h volume</div><div class="v">$128B</div><div class="sub" style="color:var(--text-secondary)">+12% vs avg</div></div>
      <div class="kpi"><div class="l">BTC dominance</div><div class="v">54.2%</div><div class="sub dn">▼ 0.4%</div></div>
      <div class="kpi gauge">${fgGauge(72)}<div class="txt"><div class="l">Fear &amp; Greed</div><div class="state">72 · Greed</div></div></div>
    </div>
    <div class="kick" style="margin-top:26px">Top movers · 24h</div>
    <div class="railhead"><span style="font:500 12px/1 var(--font);color:var(--text-secondary)">Biggest gainers, native token pinned</span>
      <div class="seg"><button class="on">Gainers</button><button>Losers</button></div></div>
    <div class="rail" style="margin-top:12px">${
      [G,...gainers.filter(c=>!c.native)].map(c=>`<div class="mover ${c.native?'native':''}">
        <div class="mtop"><span class="tk">${c.tk}</span><span class="rkk">#${c.rank}</span></div>
        <div class="pr">${c.pr}</div><div class="ch ${c.ch>=0?'up':'dn'}">${sgn(c.ch)}</div>
        ${miniW(c.spark,c.ch>=0)}</div>`).join('')}</div>
    <div class="divider"></div>
    ${featuredBlock(true)}
    <div class="divider"></div>
    <div class="grid">${listRows([...COINS].sort((a,b)=>a.rank-b.rank),true)}</div>
  </div>`; })();

/* ---------- C: + sector pills + dual feature + dense list ---------- */
(function(){ const top=[...COINS].filter(c=>!c.native).sort((a,b)=>b.ch-a.ch)[0]; const up1=G.ch>=0,up2=top.ch>=0;
  const fcard=(c,native)=>`<div class="fcard2 ${native?'native':''}">
    <div class="who"><div class="mk" style="background:linear-gradient(135deg,var(--brand-primary),var(--brand-secondary))"></div>
      <div><div class="nm">${c.nm}</div><div class="sy">${c.tk} · #${c.rank}</div></div>
      ${native?'<span class="badge">Native</span>':'<span class="badge" style="background:rgba(255,255,255,.1);color:#fff">Top mover</span>'}</div>
    <div class="pr">${c.pr}</div><div class="chg ${c.ch>=0?'up':'dn'}">${c.ch>=0?'▲':'▼'} ${sgn(c.ch)} · 24h</div>
    <div class="chart">${chartSVG(c.spark,400,96,c.ch>=0,'dc'+c.tk)}</div></div>`;
  document.getElementById('vc').innerHTML=`<div class="mag">
    ${masthead}
    <div class="sectors"><button class="spill on">All</button><button class="spill">AI</button><button class="spill">L1</button><button class="spill">DeFi</button><button class="spill">Meme</button></div>
    <div class="kick">Featured</div>
    <div class="duo">${fcard(G,true)}${fcard(top,false)}</div>
    <div class="divider"></div>
    <div class="grid" style="grid-template-columns:1fr">${
      [...COINS].sort((a,b)=>a.rank-b.rank).map(c=>`<div class="mrow ${c.native?'native':''}" style="grid-template-columns:20px 1fr 64px 70px 56px 66px 60px">
        <span class="rk">${String(c.rank).padStart(2,'0')}</span>
        <span class="nm">${c.nm}<small>${c.tk} · ${c.sec}</small></span>
        ${mini(c.spark,c.ch>=0)}
        <span class="pr">${c.pr}</span>
        <span style="text-align:right"><div class="athbar"><i style="width:${100+c.ath}%"></i></div><div style="font:500 8px/1.6 var(--font);color:var(--text-secondary)">ATH ${c.ath}%</div></span>
        <span class="pr" style="color:var(--text-secondary)">${c.vol}</span>
        <span class="ch ${c.ch>=0?'up':'dn'}">${sgn(c.ch)}</span></div>`).join('')}</div>
  </div>`; })();

document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('button'); if(!b)return;
  document.querySelectorAll('#tabs button').forEach(x=>x.setAttribute('aria-pressed',x===b));
  ['a','b','c'].forEach(v=>document.getElementById('v'+v).classList.toggle('on',v===b.dataset.v)); });
</script>
</body>
</html>
