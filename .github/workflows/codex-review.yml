name: Codex Review Request

on:
  pull_request:
    branches:
      - develop
      - main
    paths-ignore:
      - ".github/**"
      - "README.md"
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  request-review:
    runs-on: ubuntu-latest
    steps:
      - name: Comment @codex review
        env:
          GH_TOKEN: ${{ secrets.GNUS_TOKEN_1 }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr comment "$PR_URL" --body "@codex review"
