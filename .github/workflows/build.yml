name: Flutter Build and Release

on:
  push:
    branches:
      - develop
      - main
    paths-ignore:
      - "README.md"
      - ".vscode"
  pull_request:
    branches:
      - develop
      - main
    paths-ignore:
      - ".github/**"
      - "README.md"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: false
        type: string
      build_name:
        description: "Override Flutter build-name (e.g. 3.5.2)"
        required: false
        type: string
      build_number:
        description: "Override Flutter build-number (e.g. 142)"
        required: false
        type: string
      distribution_type:
        description: "Distribution type for macOS"
        required: false
        type: choice
        options:
          - "both"
          - "testflight"
          - "developer-id"
        default: "both"
      supergenius_branch:
        description: "SuperGenius dependency branch override"
        required: false
        type: string
      geniussdk_branch:
        description: "GeniusSDK dependency branch override"
        required: false
        type: string
      zkllvm_branch:
        description: "zkLLVM dependency branch override"
        required: false
        type: string
      thirdparty_branch:
        description: "thirdparty dependency branch override"
        required: false
        type: string
permissions:
  contents: write
  packages: read
jobs:
  resolve-runners:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GNUS_TOKEN_1 }}
    outputs:
      linux_x64: ${{ steps.pick.outputs.linux_x64 }}
      linux_arm: ${{ steps.pick.outputs.linux_arm }}
      windows: ${{ steps.pick.outputs.windows }}
      mac: ${{ steps.pick.outputs.mac }}
    steps:
      - name: Check self-hosted runner availability
        id: pick
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ORG="${REPO%%/*}"
          repo_err="$(mktemp)"
          org_err="$(mktemp)"

          # Some org-scoped runners may not show up via the repo endpoint for this token.
          # Query both scopes and merge the results.
          if repo_data="$(gh api "/repos/$REPO/actions/runners" --paginate 2>"$repo_err")"; then
            echo "Repository runner API query succeeded for $REPO"
          else
            echo "Repository runner API query failed for $REPO; continuing with empty repo runner set"
            repo_data='{"runners":[]}'
          fi

          if org_data="$(gh api "/orgs/$ORG/actions/runners" --paginate 2>"$org_err")"; then
            echo "Organization runner API query succeeded for $ORG"
          else
            echo "Organization runner API query failed for $ORG; continuing with empty org runner set"
            org_data='{"runners":[]}'
          fi

          data="$(jq -n --argjson repo "$repo_data" --argjson org "$org_data" '{runners: (($repo.runners // []) + ($org.runners // []) | unique_by(.id))}')"

          repo_count="$(echo "$repo_data" | jq -r '(.runners // []) | length')"
          org_count="$(echo "$org_data" | jq -r '(.runners // []) | length')"
          merged_count="$(echo "$data" | jq -r '(.runners // []) | length')"

          echo "Runner counts: repo=$repo_count org=$org_count merged=$merged_count"
          if [ "$org_count" -eq 0 ] && [ -s "$org_err" ]; then
            echo "Org endpoint error output:"
            cat "$org_err"
          fi

          echo "Discovered self-hosted runners for $REPO (repo+org merged):"
          echo "$data" | jq -r '.runners[]? | "- \(.name) | status=\(.status) | busy=\(.busy) | labels=\([.labels[].name] | join(", "))"'

          {
            echo "## Runner availability"
            echo
            echo "Repository: $REPO"
            echo "Organization: $ORG"
            echo "Counts: repo=$repo_count org=$org_count merged=$merged_count"
            echo
            echo "Discovered runners (repo+org merged):"
            echo "$data" | jq -r '.runners[]? | "- \(.name) | status=\(.status) | busy=\(.busy) | labels=\([.labels[].name] | join(", "))"'
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          # Define JSON arrays using single quotes so real double-quotes are preserved.
          SH_LINUX_X64='["self-hosted","sg-ubuntu-linux"]'
          SH_LINUX_ARM='["self-hosted","sg-arm-linux"]'
          SH_WINDOWS='["self-hosted","SG-WIN11"]'
          SH_MAC='["self-hosted","gv-OSX-Large"]'
          FB_LINUX='["ubuntu-latest"]'
          FB_LINUX_ARM='["ubuntu-24.04-arm"]'
          FB_WINDOWS='["windows-2022"]'
          FB_MAC='["macos-latest"]'

          # Returns the self-hosted label array if at least one matching runner
          # is online and not busy, otherwise returns the GitHub-hosted fallback.
          # Match either runner name or label/tag text, case-insensitively.
          pick_runner() {
            local label="$1" self_hosted="$2" fallback="$3"
            if echo "$data" | jq -e --arg L "$label" \
              '.runners[]
               | select(.status=="online" and (.busy|not))
               | select((.name | ascii_downcase) == ($L | ascii_downcase)
                 or any(.labels[]; (.name | ascii_downcase) == ($L | ascii_downcase)))' \
              >/dev/null 2>&1; then
              echo "Selector '$label' matched an available self-hosted runner" >&2
              echo "- $label: self-hosted" >> "$GITHUB_STEP_SUMMARY"
              echo "$self_hosted"
            else
              echo "Selector '$label' did not match an available self-hosted runner" >&2
              echo "- $label: fallback" >> "$GITHUB_STEP_SUMMARY"
              echo "$fallback"
            fi
          }

          echo "linux_x64=$(pick_runner 'sg-ubuntu-linux' "$SH_LINUX_X64" "$FB_LINUX")"   >> "$GITHUB_OUTPUT"
          echo "linux_arm=$(pick_runner 'sg-arm-linux'    "$SH_LINUX_ARM" "$FB_LINUX_ARM")" >> "$GITHUB_OUTPUT"
          echo "windows=$(pick_runner   'SG-WIN11'        "$SH_WINDOWS"   "$FB_WINDOWS")" >> "$GITHUB_OUTPUT"
          # GeniusWallet unconditionally uses macOS-latest for now; keep pick_runner ready for future.
          echo "mac=$FB_MAC"     >> "$GITHUB_OUTPUT"

  build:
    needs: resolve-runners
    env:
      GRPC_BUILD_ENABLE_CCACHE: "ON"
      GH_TOKEN: ${{ secrets.GNUS_TOKEN_1 }}
      RELEASE_TAG_INPUT: ${{ github.event.inputs.tag }}
    runs-on: ${{ fromJson(needs.resolve-runners.outputs[matrix.runner_key]) }}
    container:
      image: ${{matrix.container}}
      credentials:
        username: ${{github.actor}}
        password: ${{secrets.GNUS_TOKEN_1}}
    strategy:
      fail-fast: false
      matrix:
        target: [Android, iOS, OSX, Linux, Windows]
        build-type: [Release]
        abi: [""]
        include:
          - target: Linux
            runner_key: linux_x64
            flutter-platform: linux
            abi: x86_64
            build-type: Release
            container: ghcr.io/geniusventures/debian-bullseye:latest
          - target: Linux
            runner_key: linux_arm
            flutter-platform: linux
            abi: aarch64
            build-type: Release
            container: ghcr.io/geniusventures/debian-bullseye:latest
          - target: Windows
            runner_key: windows
            flutter-platform: windows
          - target: OSX
            runner_key: mac
            flutter-platform: macos
          - target: Android
            runner_key: linux_x64
            flutter-platform: apk
          - target: iOS
            runner_key: mac
            flutter-platform: ios
        exclude:
          - target: Linux
            abi: ""
    steps:
      - name: Configure Git Bash on Windows
        if: ${{ runner.environment == 'self-hosted' && matrix.target == 'Windows' }}
        run: |
          $gitBinPath = "C:\Program Files\Git\bin"

          if (Test-Path $gitBinPath) {
            Add-Content -Path $env:GITHUB_PATH -Value $gitBinPath
            $env:PATH = "$gitBinPath;$env:PATH"
          }

          Write-Output "Git Bash configured for bash shell commands"
          $bashLocation = (Get-Command bash.exe -ErrorAction SilentlyContinue).Source
          if ($bashLocation) {
            Write-Output "Bash location: $bashLocation"
          } else {
            Write-Output "WARNING: bash.exe not found in PATH"
          }

      - name: Clean workspace (self-hosted runners)
        if: ${{ runner.environment == 'self-hosted' }}
        working-directory: ${{runner.workspace}}
        run: |
          echo "=== PRE-CLEANUP DEBUG ==="
          echo "Current working directory: $(pwd)"
          echo "Runner workspace: ${{runner.workspace}}"
          echo "GitHub workspace: ${{github.workspace}}"

          # Use sudo on Linux to handle root-owned files left by container jobs
          SUDO=""
          if [ "$(uname)" = "Linux" ]; then
            SUDO="sudo"
          fi

          echo "=== CLEANUP ARTIFACTS ==="
          # Clean up artifacts from previous runs (self-hosted runners only)

          # Clean contents of GeniusWallet directory but keep the directory itself
          if [ -d "GeniusWallet" ]; then
            echo "Cleaning GeniusWallet directory contents..."
            $SUDO rm -rf GeniusWallet/* GeniusWallet/.* 2>/dev/null || true
            echo "GeniusWallet directory cleaned (kept the directory)"
          fi

          # Delete sibling dependency directories completely
          if [ -d "thirdparty" ]; then
            echo "Removing thirdparty directory..."
            $SUDO rm -rf thirdparty
          fi
          if [ -d "zkLLVM" ]; then
            echo "Removing zkLLVM directory..."
            $SUDO rm -rf zkLLVM
          fi
          if [ -d "SuperGenius" ]; then
            echo "Removing SuperGenius directory..."
            $SUDO rm -rf SuperGenius
          fi
          if [ -d "GeniusSDK" ]; then
            echo "Removing GeniusSDK directory..."
            $SUDO rm -rf GeniusSDK
          fi

          echo "=== POST-CLEANUP DEBUG ==="
          echo "Runner workspace contents:"
          ls -la
          if [ -d "GeniusWallet" ]; then
            echo "GeniusWallet directory exists and contains:"
            ls -la GeniusWallet/ 2>/dev/null || echo "  (empty)"
          fi
        shell: bash

      - name: Configure Linux host
        if: ${{ runner.os == 'Linux'}}
        env:
          TAR_OPTIONS: --no-same-owner
        run: |
          sudo apt update

          sudo update-alternatives --install /usr/bin/cc cc $(which clang) 100
          sudo update-alternatives --install /usr/bin/c++ c++ $(which clang++) 100
          sudo update-alternatives --set cc $(which clang)
          sudo update-alternatives --set c++ $(which clang++)

          # Linux desktop builds run in the Debian bullseye container.
          # Keep package origin consistent there to avoid mixed base/backports versions.
          if [ "${{ matrix.target }}" = "Linux" ]; then
            sudo apt install -y -t bullseye-backports \
              ninja-build \
              libvulkan-dev \
              libzstd-dev \
              libsecret-1-dev \
              lld

            sudo apt install -y -t bullseye-backports \
              libgtk-3-dev \
              jq

            CLANG_BIN_DIR="$(dirname "$(readlink -f "$(which clang)")")"
            LLD_PATH="$(command -v ld.lld || true)"
            if [ -n "$LLD_PATH" ] && [ ! -x "$CLANG_BIN_DIR/ld.lld" ]; then
              sudo ln -sf "$LLD_PATH" "$CLANG_BIN_DIR/ld.lld"
            fi
          else
            # Android/Linux-host jobs are not containerized and should use host repos.
            sudo apt install -y \
              ninja-build \
              libvulkan-dev \
              libzstd-dev \
              libsecret-1-dev \
              jq
          fi

          if [ "${{ runner.environment }}" = "self-hosted" ] && [ -z "${{ matrix.container }}" ] && [ -n "${RUNNER_TOOL_CACHE:-}" ]; then
            sudo mkdir -p "$RUNNER_TOOL_CACHE/flutter"
            sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TOOL_CACHE/flutter"
          fi

          echo "CMAKE_GENERATOR=Ninja" >> $GITHUB_ENV
          # Persist tar ownership behavior for all subsequent Linux steps.
          echo "TAR_OPTIONS=--no-same-owner" >> $GITHUB_ENV

      - name: Configure Windows host
        if: ${{ runner.os == 'Windows'}}
        run: |
          choco install ccache -A
          git config --system core.longpaths true

      - name: Configure macOS host
        if: ${{ runner.os == 'macOS' }}
        run: |
          brew install ninja bash gnu-tar

          # Ensure GNU tar is first in PATH - check both possible Homebrew locations
          if [ -d "/opt/homebrew/opt/gnu-tar/libexec/gnubin" ]; then
            echo "PATH=/opt/homebrew/opt/gnu-tar/libexec/gnubin:$PATH" >> $GITHUB_ENV
            echo "Using GNU tar from /opt/homebrew"
          elif [ -d "/usr/local/opt/gnu-tar/libexec/gnubin" ]; then
            echo "PATH=/usr/local/opt/gnu-tar/libexec/gnubin:$PATH" >> $GITHUB_ENV
            echo "Using GNU tar from /usr/local"
          else
            echo "WARNING: GNU tar installation not found in expected locations"
            echo "Available tar: $(which tar)"
          fi

          echo "CMAKE_GENERATOR=Ninja" >> $GITHUB_ENV

      - name: Clean stale Flutter toolcache (self-hosted Linux)
        if: ${{ runner.os == 'Linux' && runner.environment == 'self-hosted' }}
        run: |
          TOOLCACHE_ROOT="${RUNNER_TOOL_CACHE:-${ACTIONS_RUNNER_TOOL_CACHE:-/__w/_tool}}/flutter"
          echo "Checking Flutter toolcache at: $TOOLCACHE_ROOT"

          if [ -d "$TOOLCACHE_ROOT" ]; then
            # Clear Flutter toolcache so flutter-action can do a clean install.
            rm -rf "$TOOLCACHE_ROOT" || sudo rm -rf "$TOOLCACHE_ROOT"
          fi

          mkdir -p "$TOOLCACHE_ROOT" || sudo mkdir -p "$TOOLCACHE_ROOT"
          sudo chown -R "$(id -u):$(id -g)" "$TOOLCACHE_ROOT" || true

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: master
          flutter-version: 3.38.10

      - name: Set current branch
        shell: bash
        env:
          GITHUB_EVENT_INPUTS_TAG: ${{ github.event.inputs.tag }}
          GITHUB_EVENT_PULL_REQUEST_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${GITHUB_EVENT_INPUTS_TAG}" ]; then
              CURRENT_BRANCH="${GITHUB_EVENT_INPUTS_TAG}"
              IS_TAG=true
          elif ${{github.event_name == 'pull_request'}}; then
              CURRENT_BRANCH=${GITHUB_EVENT_PULL_REQUEST_HEAD_REF}
              IS_TAG=false
          else
              CURRENT_BRANCH=$GITHUB_REF_NAME
              IS_TAG=false
          fi
          echo "CURRENT_BRANCH=${CURRENT_BRANCH}" >> $GITHUB_ENV
          echo "IS_TAG=${IS_TAG}" >>$GITHUB_ENV

      - name: Checkout GeniusWallet
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: "recursive"
          persist-credentials: true

      - name: Install Apple certificates and provisioning profiles for macOS
        if: ${{ runner.os == 'macOS' }}
        env:
          # TestFlight/App Store certificates
          DEV_DISTRIBUTION_SIGNER_CERT_BASE64: ${{ secrets.DEV_DISTRIBUTION_SIGNER_CERT_BASE_64 }}
          DEV_DISTRIBUTION_IOS_PROVISION_BASE64: ${{ secrets.DEV_DISTRIBUTION_IOS_PROVISIONING_PROFILE_BASE_64 }}
          DEV_DISTRIBUTION_MAC_PROVISION_BASE64: ${{ secrets.DEV_DISTRIBUTION_MAC_PROVISIONING_PROFILE_BASE_64 }}
          DEV_DISTRIBUTION_INSTALLER_CERT_BASE_64: ${{ secrets.DEV_DISTRIBUTION_INSTALLER_CERT_BASE_64 }}

          # Developer ID certificates for direct distribution
          DEVELOPER_ID_APP_CERT_BASE64: ${{ secrets.DEVELOPER_ID_APP_CERT_BASE64 }}
          DEVELOPER_ID_INSTALLER_CERT_BASE64: ${{ secrets.DEVELOPER_ID_INSTALLER_CERT_BASE64 }}
          DEVELOPER_ID_PROVISION_BASE64: ${{ secrets.DEVELOPER_ID_PROVISION_BASE64 }}

          # Common secrets
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          DEV_DISTRIBUTION_SIGNER_P12_PASSWORD: ${{ secrets.DEV_DISTRIBUTION_SIGNER_P12_PASSWORD }}
          DEV_DISTRIBUTION_P12_PASSWORD: ${{ secrets.DEV_DISTRIBUTION_P12_PASSWORD }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}

          # Notarization
          APPLE_ID: ${{ secrets.WALLET_NOTARIZE_APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARIZATION_PASSWORD: ${{ secrets.WALLET_NOTARIZATION_PASSWORD }}
        run: |
          # create variables
          DEV_DISTRIBUTION_SIGNER_CERT_PATH=$RUNNER_TEMP/signer_certificate.p12
          DEV_DISTRIBUTION_INSTALLER_CERT_PATH=$RUNNER_TEMP/installer_certificate.p12
          DEVELOPER_ID_APP_CERT_PATH=$RUNNER_TEMP/developer_id_app.p12
          DEVELOPER_ID_INSTALLER_CERT_PATH=$RUNNER_TEMP/developer_id_installer.p12

          MP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          APP_STORE_PP_PATH=$RUNNER_TEMP/app_store_pp.provisionprofile
          DEVELOPER_ID_PP_PATH=$RUNNER_TEMP/developer_id_pp.provisionprofile

          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # import certificates and provisioning profiles from secrets
          echo -n "$DEV_DISTRIBUTION_SIGNER_CERT_BASE64" | base64 --decode -o $DEV_DISTRIBUTION_SIGNER_CERT_PATH
          echo -n "$DEV_DISTRIBUTION_INSTALLER_CERT_BASE_64" | base64 --decode -o $DEV_DISTRIBUTION_INSTALLER_CERT_PATH
          echo -n "$DEV_DISTRIBUTION_IOS_PROVISION_BASE64" | base64 --decode -o $MP_PATH
          echo -n "$DEV_DISTRIBUTION_MAC_PROVISION_BASE64" | base64 --decode -o $APP_STORE_PP_PATH

          # Developer ID certificates and provisioning profile
          echo -n "$DEVELOPER_ID_APP_CERT_BASE64" | base64 --decode -o $DEVELOPER_ID_APP_CERT_PATH
          echo -n "$DEVELOPER_ID_INSTALLER_CERT_BASE64" | base64 --decode -o $DEVELOPER_ID_INSTALLER_CERT_PATH
          echo -n "$DEVELOPER_ID_PROVISION_BASE64" | base64 --decode -o $DEVELOPER_ID_PP_PATH

          # Save original keychain list so the signing step can restore it later.
          # We intentionally do NOT trap here — the temp keychain must survive
          # into the flutter build step (Xcode needs the signing certs).
          ORIGINAL_KEYCHAINS=$(security list-keychains -d user | tr -d '"' | tr '\n' ' ')
          echo "ORIGINAL_KEYCHAINS=$ORIGINAL_KEYCHAINS" >> $GITHUB_ENV

          # Clean up old keychain from previous run (self-hosted runners reuse $RUNNER_TEMP)
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true

          # create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # import certificates to keychain
          security import $DEV_DISTRIBUTION_SIGNER_CERT_PATH -P "$DEV_DISTRIBUTION_SIGNER_P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH

          # Installer certificates are not codesigning identities — they are
          # X.509 certificates (.cer) with no private key, used by productsign.
          # Import without -f pkcs12 or -P.
          security import $DEV_DISTRIBUTION_INSTALLER_CERT_PATH -P "$DEVELOPER_ID_P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH

          # Import Developer ID certificates
          security import $DEVELOPER_ID_APP_CERT_PATH -P "$DEVELOPER_ID_P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH

          security import $DEVELOPER_ID_INSTALLER_CERT_PATH -P "$DEVELOPER_ID_P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH

          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          # Make the temp keychain the only one so Xcode finds the signing certs
          # during flutter build (the pbxproj specifies identities like
          # "Apple Distribution" / "iOS Distribution").
          security list-keychains -d user -s $KEYCHAIN_PATH

          echo "=== Keychain search list after configuration ==="
          security list-keychains -d user

          echo "=== Available identities in keychain ==="
          security find-identity -v

          echo "=== Searching for specific certificate types ==="
          security find-identity -v -p codesigning

          echo "=== All certificates in keychain ==="
          security dump-keychain $KEYCHAIN_PATH | grep -A 5 -B 5 "Developer\|3rd Party"

          # apply provisioning profiles
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles

          # App Store profiles
          cp $APP_STORE_PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/
          cp $APP_STORE_PP_PATH ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/
          cp $MP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/
          cp $MP_PATH ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/

          # Developer ID profile
          cp $DEVELOPER_ID_PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/
          cp $DEVELOPER_ID_PP_PATH ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/

          # Export paths so the signing step can access them
          echo "APP_STORE_PP_PATH=$APP_STORE_PP_PATH" >> $GITHUB_ENV
          echo "DEVELOPER_ID_PP_PATH=$DEVELOPER_ID_PP_PATH" >> $GITHUB_ENV

          echo "Finished importing certificates and provisioning profiles"
        shell: bash

      - name: Configure Android keystore
        if: ${{ matrix.target == 'Android' }}
        shell: bash
        run: |
          # Create the android directory if it doesn't exist
          mkdir -p android/app

          if [ "${{ matrix.build-type }}" = "Release" ]; then
            # ---- Decode both keystores (release + upload) ----
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release-keystore.jks
            echo "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

            # Verify release keystore
            if [ -f "android/app/release-keystore.jks" ]; then
              echo "Release keystore OK: $(wc -c < android/app/release-keystore.jks) bytes"
            else
              echo "ERROR: Release keystore not found!"
              exit 1
            fi

            # Verify upload keystore
            if [ -f "android/app/upload-keystore.jks" ]; then
              echo "Upload keystore OK: $(wc -c < android/app/upload-keystore.jks) bytes"
            else
              echo "ERROR: Upload keystore not found!"
              exit 1
            fi

            # Set key.properties to RELEASE key first (for APK build)
            echo "Setting key.properties for RELEASE (APK)..."
            echo "storePassword=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" > android/key.properties
            echo "keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}" >> android/key.properties
            echo "keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}" >> android/key.properties
            echo "storeFile=release-keystore.jks" >> android/key.properties
          else
            # Debug keystore for local/dev testing
            echo "Configuring DEBUG keystore..."
            echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
            echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
            echo "storeFile=keystore.jks" >> android/key.properties

            if [ -f "android/app/keystore.jks" ]; then
              echo "Debug keystore OK"
            else
              echo "ERROR: Debug keystore not found!"
              exit 1
            fi
          fi

          echo "Android keystore configured"
          echo "Key properties:"
          cat android/key.properties

      - name: Configure Gradle memory
        if: ${{ matrix.target == 'Android' }}
        shell: bash
        run: |
          # Create gradle.properties with increased heap size
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" > ~/.gradle/gradle.properties

          # Also set it in the project if it exists
          if [ -f "android/gradle.properties" ]; then
            echo "" >> "android/gradle.properties"
            echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> "android/gradle.properties"
          fi

      - name: Get Flutter Dependencies
        run: |
          flutter pub get

      - name: Setup Android SDK and NDK
        if: ${{ matrix.target == 'Android' }}
        shell: bash
        run: |
          # Setup Android SDK
          ANDROID_SDK_ROOT="$HOME/android-sdk"

          # Download command-line tools if not present
          if [ ! -d "$ANDROID_SDK_ROOT/cmdline-tools/latest" ]; then
            echo "Downloading Android command-line tools..."
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
            wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
            unzip -q cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
            mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            rm cmdline-tools.zip
          else
            echo "Android command-line tools already exist"
          fi

          # Always accept licenses and install/update required SDK components
          echo "Installing/updating Android SDK components..."
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

          # Set environment variables
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH

          # Verify SDK installation
          echo "=== Android SDK Setup ==="
          echo "ANDROID_HOME: $ANDROID_SDK_ROOT"
          echo "SDK contents:"
          ls -la "$ANDROID_SDK_ROOT"

          # Download and setup Android NDK
          NDK_VERSION="r27b"
          NDK_DIR="$HOME/android-ndk-$NDK_VERSION"
          if [ ! -d "$NDK_DIR" ]; then
            echo "Downloading Android NDK $NDK_VERSION..."
            wget https://dl.google.com/android/repository/android-ndk-$NDK_VERSION-linux.zip -O ndk.zip
            unzip -q ndk.zip -d $HOME
            rm ndk.zip
          else
            echo "Android NDK already exists at $NDK_DIR"
          fi
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV

          echo "=== Environment Summary ==="
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_HOME=$NDK_DIR"

      - name: Setup CMake Arguments
        shell: bash
        env:
          GITHUB_EVENT_INPUTS_TAG: ${{ github.event.inputs.tag }}
          GITHUB_EVENT_INPUTS_SUPERGENIUS_BRANCH: ${{ github.event.inputs.supergenius_branch }}
          GITHUB_EVENT_INPUTS_GENIUSSDK_BRANCH: ${{ github.event.inputs.geniussdk_branch }}
          GITHUB_EVENT_INPUTS_ZKLLVM_BRANCH: ${{ github.event.inputs.zkllvm_branch }}
          GITHUB_EVENT_INPUTS_THIRDPARTY_BRANCH: ${{ github.event.inputs.thirdparty_branch }}
        run: |
          CMAKE_ARGS="-DCMAKE_BUILD_TYPE=${{matrix.build-type}}"
          if ${{github.event_name == 'workflow_dispatch'}} && [ "${GITHUB_EVENT_INPUTS_TAG}" ]; then
            CMAKE_ARGS="$CMAKE_ARGS -DGENIUS_DEPENDENCY_BRANCH=${GITHUB_EVENT_INPUTS_TAG}"
            CMAKE_ARGS="$CMAKE_ARGS -DBRANCH_IS_TAG=ON"
          fi

          # Add dependency-specific branch overrides if provided
          if ${{github.event_name == 'workflow_dispatch'}} && [ "${GITHUB_EVENT_INPUTS_SUPERGENIUS_BRANCH}" ]; then
            CMAKE_ARGS="$CMAKE_ARGS -DGENIUS_SUPERGENIUS_BRANCH=${GITHUB_EVENT_INPUTS_SUPERGENIUS_BRANCH}"
          fi
          if ${{github.event_name == 'workflow_dispatch'}} && [ "${GITHUB_EVENT_INPUTS_GENIUSSDK_BRANCH}" ]; then
            CMAKE_ARGS="$CMAKE_ARGS -DGENIUS_GENIUSSDK_BRANCH=${GITHUB_EVENT_INPUTS_GENIUSSDK_BRANCH}"
          fi
          if ${{github.event_name == 'workflow_dispatch'}} && [ "${GITHUB_EVENT_INPUTS_ZKLLVM_BRANCH}" ]; then
            CMAKE_ARGS="$CMAKE_ARGS -DGENIUS_ZKLLVM_BRANCH=${GITHUB_EVENT_INPUTS_ZKLLVM_BRANCH}"
          fi
          if ${{github.event_name == 'workflow_dispatch'}} && [ "${GITHUB_EVENT_INPUTS_THIRDPARTY_BRANCH}" ]; then
            CMAKE_ARGS="$CMAKE_ARGS -DGENIUS_THIRDPARTY_BRANCH=${GITHUB_EVENT_INPUTS_THIRDPARTY_BRANCH}"
          fi

          # Add verbose output for debugging
          CMAKE_ARGS="$CMAKE_ARGS -DCMAKE_VERBOSE_MAKEFILE=ON"

          # macOS universal binary: disable precompiled headers (incompatible with multi-arch)
          if [ "${{ matrix.target }}" = "OSX" ]; then
            CMAKE_ARGS="$CMAKE_ARGS -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON"
          fi

          # Windows-specific: ensure message output
          if [ "${{ matrix.target }}" = "Windows" ]; then
            CMAKE_ARGS="$CMAKE_ARGS -DCMAKE_MESSAGE_LOG_LEVEL=STATUS"
          fi

          EXTRA_ARGS=""
          if [ "${{ matrix.flutter-platform }}" = "ios" ]; then
            FLUTTER_BUILD_PLATFORM="ipa"
            # extra args needed only when building with flutter build ipa or macos - we're using proper code signing now
            EXTRA_ARGS="--export-options-plist=${{ matrix.flutter-platform }}/Runner/ExportOptions.plist"
          elif [ "${{ matrix.flutter-platform }}" = "apk" ]; then
            FLUTTER_BUILD_PLATFORM="apk"
            # Force Android builds to supported ARM ABIs only.
            EXTRA_ARGS="--target-platform android-arm,android-arm64"
          else
            FLUTTER_BUILD_PLATFORM="${{ matrix.flutter-platform }}"
          fi
          if [ "${{ matrix.target }}" = "Android" ]; then
            EXTRA_ARGS="--target-platform android-arm,android-arm64"
          fi

          FLUTTER_VERSION_ARGS=""
          if ${{github.event_name == 'workflow_dispatch'}}; then
            if [ '${{ github.event.inputs.build_name }}' ]; then
              FLUTTER_VERSION_ARGS="$FLUTTER_VERSION_ARGS --build-name ${{ github.event.inputs.build_name }}"
            fi
            if [ '${{ github.event.inputs.build_number }}' ]; then
              FLUTTER_VERSION_ARGS="$FLUTTER_VERSION_ARGS --build-number ${{ github.event.inputs.build_number }}"
            fi
          fi

          echo "CMAKE_ARGUMENTS=$CMAKE_ARGS" >> $GITHUB_ENV
          echo "EXTRA_ARGS=$EXTRA_ARGS" >> $GITHUB_ENV
          echo "FLUTTER_BUILD_PLATFORM=$FLUTTER_BUILD_PLATFORM" >> $GITHUB_ENV
          echo "FLUTTER_VERSION_ARGS=$FLUTTER_VERSION_ARGS" >> $GITHUB_ENV

      - name: Build Flutter
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "Windows" ]; then
            # Windows requires a different approach for CMAKE arguments
            set CMAKE_ARGUMENTS=$env:CMAKE_ARGUMENTS
            if [ "${{ matrix.build-type }}" = "Debug" ]; then
              flutter build windows --debug ${FLUTTER_VERSION_ARGS}
            else
              flutter build windows --release ${FLUTTER_VERSION_ARGS}
            fi
          else
            # Other platforms respect CMAKE_ARGUMENTS environment variable
            if [ "${{ matrix.build-type }}" = "Debug" ]; then
              CMAKE_ARGUMENTS="${CMAKE_ARGUMENTS}" flutter build ${FLUTTER_BUILD_PLATFORM} --debug ${EXTRA_ARGS} ${FLUTTER_VERSION_ARGS}
            else
              CMAKE_ARGUMENTS="${CMAKE_ARGUMENTS}" flutter build ${FLUTTER_BUILD_PLATFORM} --release ${EXTRA_ARGS} ${FLUTTER_VERSION_ARGS} --verbose
            fi
          fi

      - name: Build Android App Bundle (AAB)
        if: ${{ matrix.target == 'Android' && matrix.build-type == 'Release' }}
        shell: bash
        run: |
          # Swap key.properties to UPLOAD key for AAB (Google re-signs with release key)
          echo "Swapping key.properties to UPLOAD key (for AAB)..."
          echo "storePassword=${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.UPLOAD_KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.UPLOAD_KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

          echo "Building Android App Bundle (AAB) for Google Play..."
          CMAKE_ARGUMENTS="${CMAKE_ARGUMENTS}" flutter build appbundle --release --target-platform android-arm,android-arm64 ${FLUTTER_VERSION_ARGS}
          echo "AAB built at: build/app/outputs/bundle/release/app-release.aab"
          ls -la build/app/outputs/bundle/release/

      - name: Install Sentry CLI (Linux)
        if: ${{ runner.os == 'Linux' && (github.ref_name == 'main' || github.ref_name == 'develop' || env.IS_TAG == 'true') }}
        run: |
          set -euo pipefail

          if command -v sentry-cli >/dev/null 2>&1; then
            echo "sentry-cli is already installed; skipping install."
            sentry-cli --version || true
          else
            curl -sL https://sentry.io/get-cli/ | sh
          fi

          if [ -d "$HOME/.local/bin" ]; then
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
        shell: bash

      - name: Install Sentry CLI (macOS)
        if: ${{ runner.os == 'macOS' && (github.ref_name == 'main' || github.ref_name == 'develop' || env.IS_TAG == 'true') }}
        run: |
          set -euo pipefail
          brew install getsentry/tools/sentry-cli
        shell: bash

      - name: Install Sentry CLI (Windows)
        if: ${{ runner.os == 'Windows' && (github.ref_name == 'main' || github.ref_name == 'develop' || env.IS_TAG == 'true') }}
        run: |
          $ErrorActionPreference = "Stop"

          # winget may return a non-zero exit code when package is already installed and no update exists.
          winget install --exact --id Sentry.sentry-cli --silent --accept-source-agreements --accept-package-agreements
          if ($LASTEXITCODE -ne 0) {
            winget list --exact --id Sentry.sentry-cli | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to install Sentry CLI via winget."
            }
            Write-Output "Sentry CLI is already installed; continuing."
          }

          $sentryCommand = Get-Command sentry.exe -ErrorAction SilentlyContinue
          if (-not $sentryCommand) {
            $packageRoots = Get-ChildItem "$env:LOCALAPPDATA\Microsoft\WinGet\Packages" -Directory -Filter "Sentry.sentry-cli*" -ErrorAction SilentlyContinue
            foreach ($root in $packageRoots) {
              $exe = Get-ChildItem $root.FullName -Recurse -Filter "sentry.exe" -File -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($exe) {
                $exeDir = Split-Path -Path $exe.FullName -Parent
                Add-Content -Path $env:GITHUB_PATH -Value $exeDir
                $env:PATH = "$exeDir;$env:PATH"
                Write-Output "Added Sentry CLI path: $exeDir"
                break
              }
            }
          }

          if (-not (Get-Command sentry.exe -ErrorAction SilentlyContinue)) {
            throw "sentry.exe not found after winget install."
          }
        shell: powershell

      - name: Upload debug symbols to Sentry
        if: ${{ github.ref_name == 'main' || github.ref_name == 'develop' || env.IS_TAG == 'true' }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          set -euo pipefail

          if [ -z "${SENTRY_AUTH_TOKEN:-}" ] || [ -z "${SENTRY_ORG:-}" ] || [ -z "${SENTRY_PROJECT:-}" ]; then
            echo "Sentry secrets are not fully configured; skipping debug symbol upload."
            exit 0
          fi

          SENTRY_CMD=""
          if command -v sentry-cli >/dev/null 2>&1; then
            SENTRY_CMD="sentry-cli"
          elif command -v sentry >/dev/null 2>&1; then
            SENTRY_CMD="sentry"
          elif command -v sentry.exe >/dev/null 2>&1; then
            SENTRY_CMD="sentry.exe"
          fi

          if [ -z "$SENTRY_CMD" ]; then
            echo "Sentry CLI executable not found in PATH."
            exit 1
          fi

          declare -a SYMBOL_PATHS=()

          add_file_matches() {
            local root="$1"
            local pattern="$2"
            if [ -d "$root" ]; then
              while IFS= read -r path; do
                SYMBOL_PATHS+=("$path")
              done < <(find "$root" -type f -name "$pattern" 2>/dev/null)
            fi
          }

          add_dir_matches() {
            local root="$1"
            local pattern="$2"
            if [ -d "$root" ]; then
              while IFS= read -r path; do
                SYMBOL_PATHS+=("$path")
              done < <(find "$root" -type d -name "$pattern" 2>/dev/null)
            fi
          }

          case "${{ matrix.target }}" in
            "Android")
              add_file_matches "build/app" "*.so"
              add_file_matches "build" "*.debug"
              ;;
            "iOS")
              add_dir_matches "build/ios" "*.dSYM"
              add_dir_matches "ios/native/build" "*.dSYM"
              ;;
            "OSX")
              add_dir_matches "build/macos" "*.dSYM"
              add_dir_matches "macos/native/build" "*.dSYM"
              add_file_matches "build/macos" "*.debug"
              ;;
            "Linux")
              add_file_matches "build/linux" "*.debug"
              add_file_matches "build/linux" "GeniusWallet"
              ;;
            "Windows")
              add_file_matches "build/windows" "*.pdb"
              add_file_matches "build/windows" "*.dll"
              add_file_matches "build/windows" "*.exe"
              ;;
          esac

          if [ ${#SYMBOL_PATHS[@]} -eq 0 ]; then
            echo "No debug symbol files found for ${{ matrix.target }}."
            exit 0
          fi

          echo "Uploading ${#SYMBOL_PATHS[@]} symbol path(s) to Sentry for ${{ matrix.target }}..."
          "$SENTRY_CMD" debug-files upload \
            --org "$SENTRY_ORG" \
            --project "$SENTRY_PROJECT" \
            --include-sources \
            "${SYMBOL_PATHS[@]}"
        shell: bash

      - name: Sign and package macOS app
        if: ${{ matrix.target == 'OSX' && (github.ref_name == 'main' || github.ref_name == 'develop' || env.IS_TAG == 'true') }}
        env:
          APPLE_ID: ${{ secrets.WALLET_NOTARIZE_APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARIZATION_PASSWORD: ${{ secrets.WALLET_NOTARIZATION_PASSWORD }}
          GITHUB_EVENT_INPUTS_DISTRIBUTION_TYPE: ${{ github.event.inputs.distribution_type }}
        run: |
          cd build/macos/Build/Products/${{matrix.build-type}}

          # Make the temp keychain the sole one for signing (so we never
          # accidentally pick a cert from the login keychain).
          # Trap-restore the original list on exit and delete the temp
          # keychain so nothing leaks on self-hosted runners.
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          trap "security list-keychains -d user -s $ORIGINAL_KEYCHAINS; security delete-keychain '$KEYCHAIN_PATH' 2>/dev/null || true" EXIT
          security list-keychains -d user -s $KEYCHAIN_PATH

          echo "=== Keychain search list at signing step ==="
          security list-keychains -d user

          # First, let's see what certificates are available
          echo "=== Available signing identities ==="
          security find-identity -v -p codesigning

          echo "=== All available identities (including installer) ==="
          security find-identity -v

          # Determine distribution type
          DISTRIBUTION_TYPE="${GITHUB_EVENT_INPUTS_DISTRIBUTION_TYPE}"
          if [ -z "$DISTRIBUTION_TYPE" ]; then
            DISTRIBUTION_TYPE="both"
          fi

          # Function to sign app with specific identity
          sign_app() {
            local cert_name="$1"
            local app_name="$2"
            local output_dir="$3"
            local pp_path="$4"

            echo "Signing app with identity: $cert_name"

            # Copy app to output directory
            mkdir -p "$output_dir"
            cp -R "Genius Wallet.app" "$output_dir/$app_name"

            # Replace the embedded provisioning profile with the correct one.
            # The flutter build may have embedded a different profile (e.g. a
            # device-restricted App Store profile). Xcode's archive→export does
            # this swap automatically; we must do it manually when re-signing.
            if [ -n "$pp_path" ] && [ -f "$pp_path" ]; then
              echo "Replacing embedded provisioning profile with: $pp_path"
              cp "$pp_path" "$output_dir/$app_name/Contents/embedded.provisionprofile"
            else
              echo "WARNING: No provisioning profile provided for $output_dir — embedded profile will not be replaced"
            fi

            # Use the project's entitlements file for Release builds
            local entitlements_path="../../../../../macos/Runner/Release.entitlements"

            echo "Checking for project entitlements file..."
            if [ -f "$entitlements_path" ]; then
              echo "Found project entitlements file: $entitlements_path"
              echo "Entitlements content:"
              cat "$entitlements_path"

              # Copy entitlements to working directory and expand variables
              cp "$entitlements_path" "$output_dir/entitlements.plist"

              # Replace $(AppIdentifierPrefix) with the actual team ID
              sed -i '' 's/$(AppIdentifierPrefix)/P7T32QQX5V./g' "$output_dir/entitlements.plist"

              /usr/libexec/PlistBuddy -c "Set :com.apple.application-identifier P7T32QQX5V.ai.gnus.GeniusWallet" "$output_dir/entitlements.plist" 2>/dev/null || \
              /usr/libexec/PlistBuddy -c "Add :com.apple.application-identifier string P7T32QQX5V.ai.gnus.GeniusWallet" "$output_dir/entitlements.plist"

              /usr/libexec/PlistBuddy -c "Set :com.apple.developer.team-identifier P7T32QQX5V" "$output_dir/entitlements.plist" 2>/dev/null || \
              /usr/libexec/PlistBuddy -c "Add :com.apple.developer.team-identifier string P7T32QQX5V" "$output_dir/entitlements.plist"


              echo "Processed entitlements:"
              cat "$output_dir/entitlements.plist"

              entitlements_to_use="$output_dir/entitlements.plist"
            else
              echo "No project entitlements file found, falling back to provisioning profile entitlements"

              # Fallback to provisioning profile entitlements
              if [ -f "$output_dir/$app_name/Contents/embedded.provisionprofile" ]; then
                echo "Extracting entitlements from provisioning profile..."
                security cms -D -i "$output_dir/$app_name/Contents/embedded.provisionprofile" | plutil -extract Entitlements xml1 -o - - > "$output_dir/pp_entitlements.plist"
                entitlements_to_use="$output_dir/pp_entitlements.plist"
              else
                echo "No provisioning profile found either"
                entitlements_to_use=""
              fi
            fi

            # Sign with the appropriate entitlements
            if [ -n "$entitlements_to_use" ] && [ -f "$entitlements_to_use" ]; then
              echo "Signing with entitlements: $entitlements_to_use"
              codesign --force --deep --sign "$cert_name" --options runtime --timestamp --entitlements "$entitlements_to_use" "$output_dir/$app_name"
            else
              echo "No entitlements available, signing without..."
              codesign --force --deep --sign "$cert_name" --options runtime --timestamp "$output_dir/$app_name"
            fi

            # If that fails, try without runtime option
            if [ $? -ne 0 ]; then
              echo "Signing with runtime failed, trying without runtime option..."
              if [ -n "$entitlements_to_use" ] && [ -f "$entitlements_to_use" ]; then
                codesign --force --deep --sign "$cert_name" --timestamp --entitlements "$entitlements_to_use" "$output_dir/$app_name"
              else
                codesign --force --deep --sign "$cert_name" --timestamp "$output_dir/$app_name"
              fi
            fi

            # If that fails, try basic signing
            if [ $? -ne 0 ]; then
              echo "Timestamp signing failed, trying basic signing..."
              codesign --force --deep --sign "$cert_name" "$output_dir/$app_name"
            fi

            # Verify signature and show entitlements
            echo "Verifying signature..."
            codesign --verify --deep --strict "$output_dir/$app_name"
            if [ $? -eq 0 ]; then
              echo "Signature verification successful"
              echo "Signed app entitlements:"
              codesign -d --entitlements - "$output_dir/$app_name"
            else
              echo "Signature verification failed"
              return 1
            fi

            echo "App signed successfully: $output_dir/$app_name"
          }

          # Function to create and sign pkg
          create_pkg() {
            local app_path="$1"
            local pkg_name="$2"
            local installer_cert_name="$3"

            echo "Creating pkg: $pkg_name"
            echo "Using installer identity: $installer_cert_name"

            # Create unsigned pkg
            xcrun productbuild --component "$app_path" /Applications "${pkg_name}_unsigned.pkg"

            # Sign the pkg
            xcrun productsign --sign "$installer_cert_name" "${pkg_name}_unsigned.pkg" "$pkg_name"

            # Verify pkg signature
            pkgutil --check-signature "$pkg_name"

            echo "Package created and signed: $pkg_name"
          }

          # Function to notarize
          notarize() {
            local file_path="$1"

            echo "Notarizing: $file_path"

            # If it's an app bundle, we need to zip it first
            if [[ "$file_path" == *.app ]]; then
              local zip_path="${file_path}.zip"
              echo "Creating zip archive for notarization: $zip_path"

              # Create zip archive (ditto preserves resource forks and metadata)
              ditto -c -k --keepParent "$file_path" "$zip_path"

              # Submit the zip for notarization
              xcrun notarytool submit "$zip_path" \
                --apple-id "$APPLE_ID" \
                --team-id "$APPLE_TEAM_ID" \
                --password "$NOTARIZATION_PASSWORD" \
                --wait

              # Clean up the zip file
              rm "$zip_path"

              # Staple the notarization to the original app
              xcrun stapler staple "$file_path"
            else
              # For pkg files, submit directly
              xcrun notarytool submit "$file_path" \
                --apple-id "$APPLE_ID" \
                --team-id "$APPLE_TEAM_ID" \
                --password "$NOTARIZATION_PASSWORD" \
                --wait

              # Staple the notarization
              xcrun stapler staple "$file_path"
            fi

            echo "Notarization completed for: $file_path"
          }

          # Build App Store version
          if [ "$DISTRIBUTION_TYPE" = "both" ] || [ "$DISTRIBUTION_TYPE" = "testflight" ]; then
            echo "Building App Store version..."
            sign_app "Apple Distribution: Genius Ventures, Inc (WY) (P7T32QQX5V)" "Genius Wallet.app" "app_store" "$APP_STORE_PP_PATH"
            create_pkg "app_store/Genius Wallet.app" "Genius Wallet_AppStore.pkg" "3rd Party Mac Developer Installer: Genius Ventures, Inc (WY) (P7T32QQX5V)"
          fi

          # Build Developer ID version
          if [ "$DISTRIBUTION_TYPE" = "both" ] || [ "$DISTRIBUTION_TYPE" = "developer-id" ]; then
            echo "Building Developer ID version..."
            sign_app "Developer ID Application: Genius Ventures, Inc (WY) (P7T32QQX5V)" "Genius Wallet.app" "developer_id" "$DEVELOPER_ID_PP_PATH"

            # Notarize the app first
            notarize "developer_id/Genius Wallet.app"

            # Create and sign the pkg (keeping original naming)
            create_pkg "developer_id/Genius Wallet.app" "Genius Wallet.pkg" "Developer ID Installer: Genius Ventures, Inc (WY) (P7T32QQX5V)"

            # Notarize the pkg
            notarize "Genius Wallet.pkg"
          fi

          echo "macOS packaging completed"
          ls -la *.pkg
        shell: bash

      - name: Prepare artifacts
        if: github.ref_name == 'main' || github.ref_name == 'develop' || env.IS_TAG == 'true'
        run: |
          mkdir -p artifacts

          case "${{ matrix.target }}" in
            "Android")
              if [ "${{ matrix.build-type }}" = "Debug" ]; then
                cp build/app/outputs/flutter-apk/app-debug.apk artifacts/
              else
                cp build/app/outputs/flutter-apk/app-release.apk artifacts/
                # Also copy the AAB for Google Play
                if [ -f "build/app/outputs/bundle/release/app-release.aab" ]; then
                  cp build/app/outputs/bundle/release/app-release.aab artifacts/
                  echo "AAB copied to artifacts/"
                fi
              fi
              ;;
            "iOS")
              # Copy the iOS IPA if it exists
              if [ -d "build/ios/ipa" ]; then
                find build/ios/ipa -name "*.ipa" -exec cp {} artifacts/ \;
              fi
              ;;
            "OSX")
              cd build/macos/Build/Products/${{matrix.build-type}}

              # Copy the signed packages
              if ls *.pkg >/dev/null 2>&1; then
                cp -r *.pkg ../../../../../artifacts/
              else
                echo "No macOS .pkg files found to upload"
              fi

              # Create a README explaining the different packages
              cat > ../../../../../artifacts/README.txt << EOF
          macOS Distribution Packages:

          - Genius Wallet_AppStore.pkg: For App Store/TestFlight distribution
          - Genius Wallet.pkg: For direct distribution outside App Store (notarized)

          Both packages are signed and ready for distribution.
          EOF
              ;;
            "Linux")
              cp -r build/linux/*/release/bundle artifacts/ || true
              cp -r build/linux/*/debug/bundle artifacts/ || true
              ;;
            "Windows")
              # Windows builds to build/windows/x64/runner/Release or Debug
              BUILD_DIR="build/windows/x64/runner/${{ matrix.build-type }}"

              echo "Looking for Windows build output in: $BUILD_DIR"

              if [ -d "$BUILD_DIR" ]; then
                echo "Found build directory: $BUILD_DIR"
                ls -la "$BUILD_DIR"
                # Copy the entire directory contents
                cp -r "$BUILD_DIR"/* artifacts/
                echo "Copied files to artifacts:"
                ls -la artifacts/
              else
                echo "Windows build directory not found at expected location: $BUILD_DIR"
                echo "Listing actual build structure:"
                find build/windows -type d 2>/dev/null || true
                echo "Windows build failed - build directory not found at $BUILD_DIR" > artifacts/build_error.txt
              fi
              ;;
          esac
        shell: bash

      - name: Compress build artifacts
        working-directory: ${{github.workspace}}
        if: github.ref_name == 'main' || github.ref_name == 'develop' || env.IS_TAG == 'true'
        run: |
          if [ '${{matrix.abi}}' ]; then
            BASE_NAME=${{matrix.target}}-${{matrix.abi}}-${{matrix.build-type}}
          else
            BASE_NAME=${{matrix.target}}-${{matrix.build-type}}
          fi

          FILTERED_ARTIFACTS_DIR="_artifacts_pkg/artifacts"
          rm -rf "$FILTERED_ARTIFACTS_DIR"
          mkdir -p "$FILTERED_ARTIFACTS_DIR"

          if command -v rsync >/dev/null 2>&1; then
            rsync -a \
              --exclude='*.pdb' \
              --exclude='*.debug' \
              --exclude='*.dSYM' \
              --exclude='*.dSYM/***' \
              artifacts/ "$FILTERED_ARTIFACTS_DIR/"
          else
            cp -r artifacts/. "$FILTERED_ARTIFACTS_DIR/"
            find "$FILTERED_ARTIFACTS_DIR" -type f \( -name "*.pdb" -o -name "*.debug" \) -delete
            find "$FILTERED_ARTIFACTS_DIR" -type d -name "*.dSYM" -prune -exec rm -rf {} +
          fi

          # Android APKs and iOS IPAs don't need compression - upload directly
          if [ "${{ matrix.target }}" = "Android" ]; then
            if [ "${{ matrix.build-type }}" = "Debug" ]; then
              ARTIFACT_NAME=${BASE_NAME}.apk
              cp artifacts/app-debug.apk ${ARTIFACT_NAME}
            else
              ARTIFACT_NAME=${BASE_NAME}.apk
              cp artifacts/app-release.apk ${ARTIFACT_NAME}
              # Also prepare AAB for Google Play
              if [ -f "artifacts/app-release.aab" ]; then
                ARTIFACT_NAME_AAB=${BASE_NAME}.aab
                cp artifacts/app-release.aab ${ARTIFACT_NAME_AAB}
                echo "ARTIFACT_NAME_AAB=${ARTIFACT_NAME_AAB}" >> $GITHUB_ENV
              fi
            fi
          elif [ "${{ matrix.target }}" = "iOS" ]; then
            # Check if we have an IPA file
            IPA_FILE=$(find artifacts -name "*.ipa" | head -1)
            if [ -n "$IPA_FILE" ] && [ -f "$IPA_FILE" ]; then
              ARTIFACT_NAME=${BASE_NAME}.ipa
              cp "$IPA_FILE" ${ARTIFACT_NAME}
            else
              # No IPA found, skip artifact creation
              echo "No iOS IPA found to upload"
              ARTIFACT_NAME=""
            fi
          # macOS packages don't need compression - upload directly
          elif [ "${{ matrix.target }}" = "OSX" ]; then
            # For macOS, we'll upload packages directly without compression
            echo "macOS packages will be uploaded individually without compression"
          # Use appropriate compression format for other platforms
          elif [ "${{ matrix.target }}" = "Windows" ]; then
            ARTIFACT_NAME=${BASE_NAME}.zip
            # Use PowerShell to create zip on Windows
            powershell -Command "Compress-Archive -Path '_artifacts_pkg/artifacts/*' -DestinationPath '${ARTIFACT_NAME}' -Force"
          else
            ARTIFACT_NAME=${BASE_NAME}.tar.gz
            tar -czvf ${ARTIFACT_NAME} -C "_artifacts_pkg" artifacts
          fi

          echo "ARTIFACT_NAME=${ARTIFACT_NAME}" >> $GITHUB_ENV

          if [ "${{ matrix.target }}" != "OSX" ]; then
            echo "Created artifact: ${ARTIFACT_NAME}"
            ls -la ${ARTIFACT_NAME}
          fi
        shell: bash

      - name: Create release of GeniusWallet
        working-directory: ${{github.workspace}}
        if: github.ref_name == 'main' || github.ref_name == 'develop' || env.IS_TAG == 'true'
        shell: bash
        run: |
          if [ -n "${RELEASE_TAG_INPUT}" ]; then
              RELEASE_TAG="${RELEASE_TAG_INPUT}"
              IS_TAG_RELEASE="true"
          else
              # Include ABI in release tag if defined
              if [ '${{matrix.abi}}' ]; then
                RELEASE_TAG="${{matrix.target}}-${{matrix.abi}}-${GITHUB_REF_NAME}-${{matrix.build-type}}"
              else
                RELEASE_TAG="${{matrix.target}}-${GITHUB_REF_NAME}-${{matrix.build-type}}"
              fi
              IS_TAG_RELEASE="false"
          fi

          echo "RELEASE_TAG=${RELEASE_TAG}" >> $GITHUB_ENV
          echo "IS_TAG_RELEASE=${IS_TAG_RELEASE}" >> $GITHUB_ENV

            echo "Checking if release $RELEASE_TAG exists..."
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              if [ "$IS_TAG_RELEASE" == "false" ]; then
                echo "Deleting existing release/tag $RELEASE_TAG..."
                gh release delete "$RELEASE_TAG" --yes || true
                git push origin ":refs/tags/$RELEASE_TAG" || true
                git tag -d "$RELEASE_TAG" || true
              else
                echo "Release $RELEASE_TAG already exists. Skipping create."
                exit 0
              fi
            fi

            echo "Creating new tag $RELEASE_TAG..."
            git tag -f "$RELEASE_TAG" "${{ github.sha }}"
            git push origin "$RELEASE_TAG" --force

            if [ "$IS_TAG_RELEASE" = "true" ]; then
            RELEASE_TITLE="$RELEASE_TAG"
            else
            RELEASE_TITLE="${{ matrix.target }} ${GITHUB_REF_NAME} ${{ matrix.build-type }} build"
            fi

            echo "Creating GitHub release $RELEASE_TAG..."
            gh release create "$RELEASE_TAG" \
            --target "${{ github.sha }}" \
            -t "$RELEASE_TITLE" \
            -n "Branch: ${GITHUB_REF_NAME} | SHA: ${{ github.sha }}" \
            $( [ "$IS_TAG_RELEASE" = "true" ] && echo "--draft" || echo "--prerelease" )

      - name: Upload file
        if: github.ref_name == 'main' || github.ref_name == 'develop' || env.IS_TAG == 'true'
        working-directory: ${{github.workspace}}
        run: |
          # Ensure RELEASE_TAG is set for upload step
            if [ -n "${RELEASE_TAG_INPUT}" ]; then
              RELEASE_TAG="${RELEASE_TAG_INPUT}"
          else
              # Include ABI in release tag if defined
              if [ '${{matrix.abi}}' ]; then
                RELEASE_TAG="${{matrix.target}}-${{matrix.abi}}-${GITHUB_REF_NAME}-${{matrix.build-type}}"
              else
                RELEASE_TAG="${{matrix.target}}-${GITHUB_REF_NAME}-${{matrix.build-type}}"
              fi
          fi

          echo "Upload step using RELEASE_TAG: $RELEASE_TAG"
          # Upload artifacts
          if [ "${{ matrix.target }}" = "OSX" ]; then
            # Upload macOS packages individually
            for pkg in artifacts/*.pkg; do
              if [ -f "$pkg" ]; then
                echo "Uploading $(basename "$pkg")"
                gh release upload --clobber ${RELEASE_TAG} "$pkg"
              fi
            done

            # Upload README
            if [ -f "artifacts/README.txt" ]; then
              gh release upload --clobber ${RELEASE_TAG} "artifacts/README.txt"
            fi
          elif [ "${{ matrix.target }}" = "iOS" ]; then
            # For iOS, only upload if we have an IPA
            if [ -n "${ARTIFACT_NAME}" ] && [ -f "${ARTIFACT_NAME}" ]; then
              echo "Uploading iOS IPA: ${ARTIFACT_NAME}"
              gh release upload --clobber ${RELEASE_TAG} "${ARTIFACT_NAME}"
            else
              echo "No iOS IPA to upload"
            fi
          else
            echo "Uploading ${ARTIFACT_NAME}"
            gh release upload --clobber ${RELEASE_TAG} "${ARTIFACT_NAME}"
            # Also upload AAB for Android if it exists
            if [ -n "${ARTIFACT_NAME_AAB:-}" ] && [ -f "${ARTIFACT_NAME_AAB}" ]; then
              echo "Uploading AAB: ${ARTIFACT_NAME_AAB}"
              gh release upload --clobber ${RELEASE_TAG} "${ARTIFACT_NAME_AAB}"
            fi
          fi
        shell: bash

  # ---------------------------------------------------------------------------
  # quality -- Phase 22 plan 08. Runs on ubuntu-latest with no native toolchain,
  # no container, no Android SDK/NDK, no Apple certs -- none of these gates need
  # the five-platform release matrix above, so failures surface in minutes
  # instead of after a full native build. Everything Phase 22 built (analyzer 0,
  # brace rule, three security gates, dart format, the test suite) was
  # UNENFORCED on CI until this job landed; see 22-08-SUMMARY.md.
  #
  # Flutter action SHA + flutter-version below are intentionally byte-identical
  # to the `build` job's `Setup Flutter` step -- two SDK versions in one
  # workflow is how "green on CI, red locally" starts.
  # ---------------------------------------------------------------------------
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GeniusWallet
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: master
          flutter-version: 3.38.10

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Enforce dart format (lib, test)
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Enforce flutter analyze (lib, test)
        run: flutter analyze lib test

      - name: Self-test the brace-style detector (tool/check_brace_style.sh --self-test)
        run: bash tool/check_brace_style.sh --self-test

      - name: Enforce brace-every-if style (AGENTS.md Dart coding standards)
        run: bash tool/check_brace_style.sh

      - name: Security gate -- no key-material console logging in the SDK account manager
        run: bash tool/check_no_new_key_logging.sh --scan-tree

      - name: Security gate -- onboarding seed safety (06-UI-SPEC.md Section 3, six checks)
        run: bash tool/check_onboarding_seed_safety.sh

      # NON-BLOCKING BY DELIBERATE CHOICE, not an oversight -- see
      # .planning/phases/22-codebase-organization-standards-config-dead-code-deletion-th/deferred-items.md
      # and 22-08-SUMMARY.md for the full record. This gate has 2 KNOWN
      # pre-existing failures unrelated to any change in this repo since Phase
      # 8 (a WIRE-02 prose false positive in Check 3) and Phase 16 (6 private
      # (`_`-prefixed) "duplicate class name" false positives in Check 2, which
      # is structurally blind to Dart's library-scoped privacy). Check 1 -- the
      # actual shadow-import-boundary logic this phase's threat model cares
      # about (Loading / Splash / WalletsOverview) -- passes cleanly today.
      # Wiring this gate hard on day one would make the new `quality` job red
      # for reasons no PR author could fix, which teaches a team to ignore red
      # checks -- exactly the failure mode this phase exists to prevent. Flip
      # to blocking (delete the `continue-on-error` line) once a future plan
      # resolves the two findings (baseline the 6 private names, or exclude
      # `_`-prefixed names from Check 2's census regex; reword or allowlist the
      # Check 3 WIRE-02 prose match).
      - name: Security gate -- additive shadow-import boundary (non-blocking, 2 pre-existing false positives)
        continue-on-error: true
        run: bash tool/verify_additive_boundary.sh

      - name: Run tests with coverage (randomized order; --report-on lib does not exist on this SDK, flutter test --coverage already scopes lcov.info to lib/ -- see 22-08-SUMMARY.md)
        run: flutter test --coverage --test-randomize-ordering-seed random

      - name: Check for Codecov token
        id: codecov_check
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -n "${CODECOV_TOKEN:-}" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "CODECOV_TOKEN is not configured as a repository secret; skipping the coverage upload. See codecov.yml and 22-08-SUMMARY.md for the operator setup steps."
          fi

      - name: Upload coverage to Codecov
        if: ${{ steps.codecov_check.outputs.has_token == 'true' }}
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: false
